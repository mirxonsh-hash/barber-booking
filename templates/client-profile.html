<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iWant - Ваши барберы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
        }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }
        
        .icon-btn {
            background: #222;
            border: 1px solid #333;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .icon-btn:hover {
            background: #333;
            border-color: #4a6fa5;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .welcome-section {
            padding: 30px 0;
            text-align: center;
        }
        
        .welcome-title {
            font-size: 18px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .add-barber-btn {
            width: 100%;
            padding: 18px;
            background: #4a6fa5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(74, 111, 165, 0.3);
        }
        
        .add-barber-btn:hover {
            background: #5a7fb5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 111, 165, 0.4);
        }
        
        .add-barber-btn:active {
            transform: translateY(0);
        }
        
        .barbers-section {
            margin-top: 30px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        
        .barber-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #333;
        }
        
        .barber-card:hover {
            background: #222;
            transform: translateY(-1px);
            border-color: #4a6fa5;
        }
        
        .barber-avatar {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .barber-info {
            flex: 1;
        }
        
        .barber-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        
        .barber-code {
            font-size: 14px;
            color: #4a6fa5;
            background: rgba(74, 111, 165, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            font-family: 'Courier New', monospace;
            border: 1px solid rgba(74, 111, 165, 0.3);
        }
        
        .barber-meta {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .barber-stats {
            display: flex;
            gap: 10px;
        }
        
        .stat-item {
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .barber-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            background: #222;
            border: 1px solid #333;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #aaa;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            background: #333;
            color: #fff;
        }
        
        .action-btn.primary {
            background: #4a6fa5;
            color: white;
            border-color: #4a6fa5;
        }
        
        .action-btn.primary:hover {
            background: #5a7fb5;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 48px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .empty-state h3 {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .fab {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #4a6fa5;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(74, 111, 165, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 1000;
        }
        
        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(74, 111, 165, 0.5);
        }
        
        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid #333;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-content {
            background: #1a1a1a;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        
        .close-modal {
            background: #222;
            border: 1px solid #333;
            font-size: 20px;
            color: #aaa;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .close-modal:hover {
            background: #333;
            color: #fff;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            color: #fff;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #4a6fa5;
        }
        
        .modal-footer {
            padding: 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #4a6fa5;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a7fb5;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(74, 111, 165, 0.4);
        }
        
        .btn-secondary {
            background: #333;
            color: #fff;
            border: 1px solid #444;
        }
        
        .btn-secondary:hover {
            background: #444;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }
            
            .header {
                padding: 15px;
            }
            
            .barber-card {
                padding: 15px;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .barber-card {
            animation: fadeIn 0.3s ease-out;
        }
        
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .modal-content::-webkit-scrollbar-track {
            background: #222;
            border-radius: 10px;
        }
        
        .modal-content::-webkit-scrollbar-thumb {
            background: #4a6fa5;
            border-radius: 10px;
        }
        
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #5a7fb5;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #222;
            border-top: 3px solid #4a6fa5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- ОСТАЛЬНОЙ HTML КОД БЕЗ ИЗМЕНЕНИЙ -->
    <div class="header">
        <button class="icon-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="logo">iWant</div>
        <div class="profile-avatar" id="profileAvatar" onclick="openProfile()">
            <span id="avatarInitials">ТК</span>
        </div>
    </div>
    
    <div class="container">
        <div class="welcome-section">
            <h1 class="welcome-title">ваши барберы</h1>
            <button class="add-barber-btn" onclick="openAddBarberModal()">
                <i class="fas fa-plus"></i>
                + добавить
            </button>
        </div>
        
        <div class="barbers-section" id="barbersSection">
            <div id="loadingBarbers" class="empty-state">
                <div class="spinner"></div>
                <p>Загрузка барберов...</p>
            </div>
        </div>
    </div>
    
    <div id="addBarberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Добавить барбера</h3>
                <button class="close-modal" onclick="closeAddBarberModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Код барбера</label>
                    <input type="text" id="barberCode" class="form-input" placeholder="Введите код барбера" maxlength="20">
                </div>
                <div class="form-group">
                    <label class="form-label">Имя барбера (необязательно)</label>
                    <input type="text" id="barberName" class="form-input" placeholder="Как зовут барбера?" maxlength="50">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddBarberModal()">Отмена</button>
                <button class="btn btn-primary" onclick="addBarber()">Добавить</button>
            </div>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Мой профиль</h3>
                <button class="close-modal" onclick="closeProfileModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; margin-bottom: 30px;">
                    <div id="modalAvatar" style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; font-weight: 600; border: 3px solid #333;"></div>
                    <h2 id="modalUserName" style="font-size: 20px; color: #fff; margin-bottom: 5px;"></h2>
                    <p id="modalUserPhone" style="color: #aaa; font-size: 14px;"></p>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="tel" id="userPhoneInput" class="form-input" placeholder="+7 (999) 123-45-67" maxlength="20">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="clearData()">Очистить данные</button>
                <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>
    
    <button class="fab" onclick="openAddBarberModal()">
        <i class="fas fa-plus"></i>
    </button>

    <!-- JavaScript код без изменений -->
    <script>
        const API_BASE = 'https://barber-booking-db.onrender.com';
        let userData = null;
        let barbers = [];
        
        // Весь JavaScript код остается без изменений
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Инициализация страницы...');
            initTelegramApp();
            
            setTimeout(() => {
                loadUserData();
                loadBarbers();
            }, 100);
        });
        
        // ... Весь остальной JavaScript код без изменений ...
    </script>
</body>
</html>
