<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iWant - Ваши барберы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Стеклянный эффект для всех элементов */
        .header, .add-barber-btn, .barber-card, .icon-btn, 
        .modal-content, .form-input, .btn, .fab,
        .profile-avatar, .modal-btn, .action-btn {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(26, 26, 26, 0.7) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .add-barber-btn:hover, .barber-card:active, .icon-btn:hover,
        .btn:hover, .fab:hover, .action-btn:hover,
        .close-modal:hover, .modal-btn:hover {
            background: rgba(74, 111, 165, 0.4) !important;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 12px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: rgba(74, 111, 165, 0.3) !important;
        }
        
        .form-input:focus {
            background: rgba(34, 34, 34, 0.8) !important;
            border-color: rgba(74, 111, 165, 0.5) !important;
            box-shadow: 
                0 0 0 2px rgba(74, 111, 165, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .btn-primary {
            background: rgba(74, 111, 165, 0.3) !important;
        }
        
        .btn-primary:hover {
            background: rgba(74, 111, 165, 0.5) !important;
        }
        
        .btn-secondary {
            background: rgba(51, 51, 51, 0.7) !important;
        }
        
        .btn-secondary:hover {
            background: rgba(74, 111, 165, 0.4) !important;
        }
        
        .action-btn.primary {
            background: rgba(74, 111, 165, 0.3) !important;
            border-color: rgba(74, 111, 165, 0.5) !important;
        }
        
        .action-btn.primary:hover {
            background: rgba(74, 111, 165, 0.5) !important;
        }
        
        .barber-code {
            background: rgba(74, 111, 165, 0.1) !important;
            border: 1px solid rgba(74, 111, 165, 0.3) !important;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        .empty-state, .test-data {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(34, 34, 34, 0.7) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Модальное окно успеха */
        .success-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .success-modal {
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
            animation: modalAppear 0.5s ease-out;
        }
        
        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .success-icon {
            font-size: 60px;
            color: #4a6fa5;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .success-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: white;
        }
        
        .success-message {
            color: #aaa;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        /* Базовые стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(51, 51, 51, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            padding-top: max(15px, env(safe-area-inset-top));
        }
        
        .logo-img {
            height: 40px;
            width: auto;
            filter: brightness(0) invert(1);
        }
        
        .icon-btn {
            font-size: 20px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .icon-btn:active {
            transform: scale(0.95);
        }
        
        .container {
            max-width: 100%;
            padding: 0 15px;
        }
        
        .welcome-section {
            padding: 25px 0;
            text-align: center;
        }
        
        .welcome-title {
            font-size: 18px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .add-barber-btn {
            width: 100%;
            padding: 18px;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
        }
        
        .add-barber-btn:active {
            transform: translateY(0);
        }
        
        .barbers-section {
            margin-top: 30px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        
        .barber-card {
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        .barber-card:active {
            transform: scale(0.98);
        }
        
        .barber-avatar {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .barber-info {
            flex: 1;
            min-width: 0;
        }
        
        .barber-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .barber-code {
            font-size: 14px;
            color: #4a6fa5;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            font-family: 'Courier New', monospace;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .barber-meta {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .barber-stats {
            display: flex;
            gap: 10px;
        }
        
        .stat-item {
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .barber-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #aaa;
        }
        
        .action-btn:active {
            transform: scale(0.95);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 48px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .empty-state h3 {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .fab {
            position: fixed;
            bottom: max(30px, env(safe-area-inset-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 1000;
            -webkit-tap-highlight-color: transparent;
        }
        
        .fab:active {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }
        
        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .modal-content {
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            -webkit-overflow-scrolling: touch;
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(51, 51, 51, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        
        .close-modal {
            font-size: 20px;
            color: #aaa;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .close-modal:active {
            color: #fff;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            color: #fff;
            -webkit-appearance: none;
        }
        
        .form-input:focus {
            outline: none;
        }
        
        .modal-footer {
            padding: 20px;
            border-top: 1px solid rgba(51, 51, 51, 0.5);
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-primary {
            color: white;
        }
        
        .btn-primary:active {
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            color: #fff;
        }
        
        .btn-secondary:active {
            background: rgba(74, 111, 165, 0.4) !important;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }
            
            .header {
                padding: 15px;
            }
            
            .barber-card {
                padding: 15px;
            }
            
            .welcome-section {
                padding: 20px 0;
            }
            
            .modal {
                padding: 15px;
            }
            
            .modal-content {
                max-height: 85vh;
            }
            
            .fab {
                bottom: max(25px, env(safe-area-inset-bottom));
                right: 15px;
            }
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .barber-card {
            animation: fadeIn 0.3s ease-out;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(34, 34, 34, 0.5);
            border-top: 3px solid #4a6fa5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Улучшение для маленьких экранов */
        @media (max-width: 360px) {
            .barber-card {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            
            .barber-info {
                width: 100%;
            }
            
            .barber-actions {
                width: 100%;
                justify-content: center;
            }
        }
        
        /* Улучшение видимости кнопок на телефонах */
        button, .btn, .action-btn, .icon-btn {
            min-height: 44px;
            min-width: 44px;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="icon-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <img src="/images/logo.gif" alt="iWant" class="logo-img">
        <div class="profile-avatar" id="profileAvatar" onclick="openProfileModal()">
            <span id="avatarInitials">ТК</span>
        </div>
    </div>
    
    <div class="container">
        <div class="welcome-section">
            <h1 class="welcome-title">ваши барберы</h1>
            <button class="add-barber-btn" onclick="openAddBarberModal()">
                <i class="fas fa-plus"></i>
                + добавить
            </button>
        </div>
        
        <div class="barbers-section" id="barbersSection">
            <div id="loadingBarbers" class="empty-state">
                <div class="spinner"></div>
                <p>Загрузка барберов...</p>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно добавления барбера -->
    <div id="addBarberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Добавить барбера</h3>
                <button class="close-modal" onclick="closeAddBarberModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Код барбера</label>
                    <input type="text" id="barberCodeInput" class="form-input" placeholder="Введите код барбера" maxlength="20">
                </div>
                <div class="form-group">
                    <label class="form-label">Имя барбера (необязательно)</label>
                    <input type="text" id="barberNameInput" class="form-input" placeholder="Как зовут барбера?" maxlength="50">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddBarberModal()">Отмена</button>
                <button class="btn btn-primary" onclick="addBarber()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Мой профиль</h3>
                <button class="close-modal" onclick="closeProfileModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; margin-bottom: 30px;">
                    <div id="modalAvatar" style="width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; font-weight: 600;"></div>
                    <h2 id="modalUserName" style="font-size: 20px; color: #fff; margin-bottom: 5px;"></h2>
                    <p id="modalUserPhone" style="color: #aaa; font-size: 14px;"></p>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="tel" id="userPhoneInput" class="form-input" placeholder="+7 (999) 123-45-67" maxlength="20">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="clearData()">Очистить данные</button>
                <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно успеха -->
    <div id="successModal" class="success-modal-overlay">
        <div class="success-modal">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="success-title">Успешно записались!</h2>
            <p class="success-message" id="successModalMessage">
                Вы успешно записались к барберу. Через 4 секунды вы будете перенаправлены на главную страницу.
            </p>
            <button class="btn" onclick="goHome()" style="background: rgba(74, 111, 165, 0.2);">
                Перейти сейчас
            </button>
        </div>
    </div>
    
    <button class="fab" onclick="openAddBarberModal()">
        <i class="fas fa-plus"></i>
    </button>

    <script>
        const API_BASE = 'https://barber-booking-db.onrender.com';
        let userData = null;
        let barbers = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Инициализация страницы...');
            
            initTelegramApp();
            
            setTimeout(() => {
                loadUserData();
                loadBarbers();
            }, 100);
            
            // Проверяем, нужно ли показать окно успеха
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                setTimeout(() => {
                    showSuccessModal('Вы успешно записались к барберу! Через 4 секунды вы будете перенаправлены на главную страницу.');
                }, 1000);
            }
        });
        
        function initTelegramApp() {
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                console.log('✅ Telegram Web App обнаружен!');
                
                const tg = Telegram.WebApp;
                tg.expand();
                tg.ready();
                
                const user = tg.initDataUnsafe?.user;
                const initData = tg.initData;
                
                console.log('👤 Telegram User:', user);
                console.log('🔑 Init Data доступен:', initData ? 'ДА' : 'НЕТ');
                
                if (user) {
                    localStorage.setItem('telegram_user', JSON.stringify(user));
                    localStorage.setItem('telegram_user_id', user.id.toString());
                    
                    if (initData)
