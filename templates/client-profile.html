<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iWant - Мой профиль</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/client-profile.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-top: 10px;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-3px);
        }
        
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .avatar-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #667eea;
            object-fit: cover;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            margin: 0 auto 15px;
        }
        
        .user-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .user-phone {
            color: #666;
            font-size: 16px;
        }
        
        .info-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 14px;
            color: #667eea;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .info-grid {
            display: grid;
            gap: 15px;
        }
        
        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
        }
        
        .info-item:hover {
            background: #f0f2f5;
            transform: translateY(-2px);
        }
        
        .info-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .info-content {
            flex: 1;
        }
        
        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
        }
        
        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        
        .history-section {
            margin-top: 30px;
        }
        
        .history-list {
            display: grid;
            gap: 10px;
        }
        
        .history-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        
        .history-item:hover {
            background: #f0f2f5;
        }
        
        .history-details {
            flex: 1;
        }
        
        .history-date {
            font-size: 14px;
            color: #888;
        }
        
        .history-service {
            font-size: 16px;
            color: #333;
            font-weight: 500;
            margin: 5px 0;
        }
        
        .history-barber {
            font-size: 14px;
            color: #667eea;
        }
        
        .history-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-confirmed {
            background: #cce5ff;
            color: #004085;
        }
        
        .status-completed {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        
        .no-history {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        
        .actions-section {
            margin-top: 30px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .action-btn.secondary {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .action-btn.secondary:hover {
            background: #667eea;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: white;
            margin-top: 20px;
        }
        
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 20px;
            font-size: 14px;
        }
        
        @media (max-width: 480px) {
            .profile-card {
                padding: 20px;
            }
            
            .avatar, .avatar-placeholder {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="logo">iWant</div>
            <div style="width: 40px;"></div>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Загрузка профиля...</p>
        </div>
        
        <div id="profileContent" style="display: none;">
            <div class="profile-card">
                <div class="avatar-section">
                    <img id="userAvatar" class="avatar" alt="Аватар" style="display: none;">
                    <div id="avatarPlaceholder" class="avatar-placeholder">
                        <i class="fas fa-user"></i>
                    </div>
                    <h1 id="userName" class="user-name"></h1>
                    <p id="userPhone" class="user-phone"></p>
                </div>
                
                <div class="info-section">
                    <h2 class="section-title">Моя информация</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-icon">
                                <i class="fas fa-user-tie"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label">Мой барбер</div>
                                <div id="myBarber" class="info-value">Не выбран</div>
                            </div>
                        </div>
                        
                        <div class="info-item">
                            <div class="info-icon">
                                <i class="fas fa-scissors"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label">Всего записей</div>
                                <div id="totalAppointments" class="info-value">0</div>
                            </div>
                        </div>
                        
                        <div class="info-item">
                            <div class="info-icon">
                                <i class="fas fa-star"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label">Любимая услуга</div>
                                <div id="favoriteService" class="info-value">Не определено</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="history-section">
                    <h2 class="section-title">История записей</h2>
                    <div id="historyList" class="history-list">
                        <!-- История будет загружена здесь -->
                    </div>
                    <div id="noHistory" class="no-history">
                        <i class="fas fa-calendar-alt" style="font-size: 48px; margin-bottom: 15px; color: #ddd;"></i>
                        <p>У вас еще нет записей</p>
                        <p style="font-size: 14px; margin-top: 10px;">Запишитесь к барберу чтобы увидеть историю</p>
                    </div>
                </div>
                
                <div class="actions-section">
                    <button class="action-btn" onclick="bookAppointment()">
                        <i class="fas fa-calendar-plus"></i>
                        Новая запись
                    </button>
                    <button class="action-btn secondary" onclick="changeBarber()">
                        <i class="fas fa-exchange-alt"></i>
                        Сменить барбера
                    </button>
                    <button class="action-btn secondary" onclick="clearData()">
                        <i class="fas fa-trash-alt"></i>
                        Очистить данные
                    </button>
                </div>
            </div>
        </div>
        
        <div id="errorMessage" class="error-message" style="display: none;">
            <!-- Сообщения об ошибках -->
        </div>
        
        <div class="footer">
            © 2024 iWant. Премиум сервис записи
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Telegram Web App API
        const tg = window.Telegram?.WebApp;
        const API_BASE = 'https://barber-booking-db.onrender.com';
        
        // Состояние приложения
        let userData = null;
        let userHistory = [];
        let lastBarberCode = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Профиль клиента загружается...');
            
            // Инициализация Telegram Web App
            initTelegramApp();
            
            // Загружаем данные пользователя
            loadUserData();
        });
        
        function initTelegramApp() {
            if (tg) {
                console.log('📱 Telegram Web App обнаружен');
                
                // Инициализируем Telegram Web App
                tg.ready();
                tg.expand();
                
                // Получаем данные пользователя из Telegram
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    // Отправляем данные на сервер для аутентификации
                    const initData = tg.initData;
                    if (initData) {
                        sendTelegramDataToServer(user, initData);
                    }
                }
                
                // Настраиваем кнопку "Назад"
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    goBack();
                });
            } else {
                console.log('🌐 Не в Telegram Web App');
            }
        }
        
        async function sendTelegramDataToServer(user, initData) {
            try {
                console.log('📤 Отправка данных Telegram на сервер...');
                
                const response = await fetch(`${API_BASE}/api/telegram/auth?tg_data=${encodeURIComponent(initData)}`);
                const data = await response.json();
                
                console.log('✅ Ответ от сервера:', data);
                if (data.success && data.profile) {
                    // Сохраняем профиль в localStorage
                    localStorage.setItem('user_profile', JSON.stringify(data.profile));
                    console.log('💾 Профиль сохранен в localStorage');
                }
            } catch (error) {
                console.error('❌ Ошибка отправки данных:', error);
            }
        }
        
        function loadUserData() {
            // Пытаемся загрузить данные из разных источников
            const telegramUser = tg?.initDataUnsafe?.user;
            const savedProfile = localStorage.getItem('user_profile');
            
            if (telegramUser) {
                // Используем данные из Telegram
                userData = {
                    id: telegramUser.id,
                    firstName: telegramUser.first_name,
                    lastName: telegramUser.last_name,
                    username: telegramUser.username,
                    photoUrl: telegramUser.photo_url,
                    languageCode: telegramUser.language_code,
                    isPremium: telegramUser.is_premium || false
                };
                console.log('✅ Данные из Telegram:', userData);
            } else if (savedProfile) {
                // Используем сохраненный профиль
                const profile = JSON.parse(savedProfile);
                userData = {
                    id: profile.telegram_id,
                    firstName: profile.first_name,
                    lastName: profile.last_name,
                    username: profile.username,
                    photoUrl: profile.photo_url,
                    phone: profile.phone
                };
                console.log('📱 Данные из localStorage:', userData);
            } else {
                // Используем тестовые данные
                userData = {
                    id: Date.now(),
                    firstName: 'Тестовый',
                    lastName: 'Клиент',
                    username: 'test_user',
                    photoUrl: null
                };
                console.log('🧪 Тестовые данные пользователя');
            }
            
            // Загружаем профиль с сервера
            loadUserProfile();
        }
        
        async function loadUserProfile() {
            try {
                // Показываем данные пользователя
                updateUserInfo();
                
                // Загружаем профиль с сервера
                if (userData.id) {
                    await fetchUserProfile(userData.id);
                } else {
                    // Если нет ID, показываем только базовую информацию
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('profileContent').style.display = 'block';
                    document.getElementById('noHistory').style.display = 'block';
                }
                
            } catch (error) {
                console.error('❌ Ошибка загрузки профиля:', error);
                showError('Ошибка загрузки профиля');
            }
        }
        
        async function fetchUserProfile(telegramId) {
            try {
                // Запрашиваем профиль с сервера
                const response = await fetch(`${API_BASE}/api/client/profile?telegram_id=${telegramId}`);
                
                if (response.ok) {
                    const result = await response.json();
                    
                    if (result.success) {
                        // Обновляем данные пользователя
                        if (result.profile) {
                            userData.firstName = result.profile.first_name || userData.firstName;
                            userData.lastName = result.profile.last_name || userData.lastName;
                            userData.username = result.profile.username || userData.username;
                            userData.photoUrl = result.profile.photo_url || userData.photoUrl;
                            userData.phone = result.profile.phone || userData.phone;
                            
                            // Сохраняем обновленный профиль
                            localStorage.setItem('user_profile', JSON.stringify(result.profile));
                        }
                        
                        // Обновляем историю записей
                        userHistory = result.appointments || [];
                        updateHistoryList();
                        
                        // Обновляем статистику
                        if (result.stats) {
                            document.getElementById('totalAppointments').textContent = result.stats.total || 0;
                        }
                        
                        // Сохраняем последнего барбера
                        if (result.profile && result.profile.last_barber_code) {
                            lastBarberCode = result.profile.last_barber_code;
                            localStorage.setItem('last_barber_code', lastBarberCode);
                            await loadBarberInfo(lastBarberCode);
                        }
                        
                        // Определяем любимую услугу
                        updateFavoriteService();
                        
                    } else {
                        console.warn('⚠️ Профиль не найден на сервере');
                        userHistory = [];
                        updateHistoryList();
                    }
                } else {
                    console.warn('⚠️ Ошибка при запросе профиля');
                    userHistory = [];
                    updateHistoryList();
                }
                
                // Показываем контент
                document.getElementById('loading').style.display = 'none';
                document.getElementById('profileContent').style.display = 'block';
                
            } catch (error) {
                console.error('❌ Ошибка загрузки профиля:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('profileContent').style.display = 'block';
                document.getElementById('noHistory').style.display = 'block';
            }
        }
        
        function updateUserInfo() {
            if (!userData) return;
            
            const name = `${userData.firstName || ''} ${userData.lastName || ''}`.trim() || 'Пользователь';
            const phone = userData.phone || (userData.username ? `@${userData.username}` : 'Телефон не указан');
            
            document.getElementById('userName').textContent = name;
            document.getElementById('userPhone').textContent = phone;
            
            // Устанавливаем аватар
            const avatarImg = document.getElementById('userAvatar');
            const avatarPlaceholder = document.getElementById('avatarPlaceholder');
            
            if (userData.photoUrl) {
                avatarImg.src = userData.photoUrl;
                avatarImg.onload = function() {
                    avatarImg.style.display = 'block';
                    avatarPlaceholder.style.display = 'none';
                };
                avatarImg.onerror = function() {
                    showAvatarFallback(name);
                };
            } else {
                showAvatarFallback(name);
            }
        }
        
        function showAvatarFallback(name) {
            const avatarImg = document.getElementById('userAvatar');
            const avatarPlaceholder = document.getElementById('avatarPlaceholder');
            
            // Генерируем градиентный аватар на основе ID или имени
            const colors = [
                ['#667eea', '#764ba2'],
                ['#f093fb', '#f5576c'],
                ['#4facfe', '#00f2fe'],
                ['#43e97b', '#38f9d7'],
                ['#fa709a', '#fee140']
            ];
            
            const id = userData?.id || 0;
            const colorIndex = Math.abs(id) % colors.length;
            const gradient = `linear-gradient(135deg, ${colors[colorIndex][0]} 0%, ${colors[colorIndex][1]} 100%)`;
            
            avatarPlaceholder.style.background = gradient;
            avatarPlaceholder.style.display = 'flex';
            avatarImg.style.display = 'none';
            
            // Показываем первую букву имени
            const firstLetter = name.charAt(0).toUpperCase();
            avatarPlaceholder.innerHTML = `<span style="font-size: 48px; font-weight: bold;">${firstLetter}</span>`;
        }
        
        function updateHistoryList() {
            const historyList = document.getElementById('historyList');
            const noHistory = document.getElementById('noHistory');
            
            if (!historyList) return;
            
            historyList.innerHTML = '';
            
            if (userHistory.length === 0) {
                noHistory.style.display = 'block';
                document.getElementById('totalAppointments').textContent = '0';
                return;
            }
            
            noHistory.style.display = 'none';
            
            // Сортируем записи по дате (новые сначала)
            const sortedHistory = [...userHistory].sort((a, b) => {
                return new Date(b.date) - new Date(a.date);
            });
            
            sortedHistory.forEach(record => {
                const date = new Date(record.date);
                const dateStr = date.toLocaleDateString('ru-RU');
                const statusClass = `status-${record.status || 'active'}`;
                const statusText = getStatusText(record.status);
                
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div class="history-details">
                        <div class="history-date">${dateStr} ${record.time || ''}</div>
                        <div class="history-service">${record.service || record.service_name || 'Услуга'}</div>
                        <div class="history-barber">${record.barber || record.barber_name || 'Барбер'}</div>
                    </div>
                    <div class="history-status ${statusClass}">${statusText}</div>
                `;
                
                historyList.appendChild(item);
            });
            
            // Обновляем статистику
            document.getElementById('totalAppointments').textContent = userHistory.length;
        }
        
        function updateFavoriteService() {
            if (userHistory.length === 0) {
                document.getElementById('favoriteService').textContent = 'Не определено';
                return;
            }
            
            // Определяем любимую услугу
            const serviceCount = {};
            userHistory.forEach(record => {
                const service = record.service || record.service_name;
                if (service) {
                    serviceCount[service] = (serviceCount[service] || 0) + 1;
                }
            });
            
            let favoriteService = 'Не определено';
            let maxCount = 0;
            
            for (const [service, count] of Object.entries(serviceCount)) {
                if (count > maxCount) {
                    maxCount = count;
                    favoriteService = service;
                }
            }
            
            document.getElementById('favoriteService').textContent = favoriteService;
        }
        
        async function loadBarberInfo(barberCode) {
            try {
                const response = await fetch(`${API_BASE}/api/barber/${barberCode}`);
                const data = await response.json();
                
                if (data.success && data.barber) {
                    document.getElementById('myBarber').textContent = data.barber.name;
                } else {
                    document.getElementById('myBarber').textContent = `Барбер ${barberCode}`;
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки барбера:', error);
                document.getElementById('myBarber').textContent = `Барбер ${barberCode}`;
            }
        }
        
        function getStatusText(status) {
            const statusMap = {
                'active': 'Активна',
                'pending': 'Ожидает',
                'confirmed': 'Подтверждена',
                'completed': 'Выполнена',
                'cancelled': 'Отменена'
            };
            return statusMap[status] || 'Активна';
        }
        
        function bookAppointment() {
            if (lastBarberCode) {
                // Переходим к записи у текущего барбера
                window.location.href = `${API_BASE}/client-panel?code=${lastBarberCode}`;
            } else {
                // Ищем нового барбера
                window.location.href = `${API_BASE}/client-login`;
            }
        }
        
        function changeBarber() {
            window.location.href = `${API_BASE}/client-login`;
        }
        
        function clearData() {
            if (confirm('Вы уверены, что хотите очистить все ваши данные? Это удалит историю записей и информацию о барбере.')) {
                localStorage.removeItem('user_profile');
                localStorage.removeItem('last_barber_code');
                
                // Обновляем страницу
                window.location.reload();
            }
        }
        
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = API_BASE;
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = `
                <h3 style="margin-bottom: 10px;">⚠️ Ошибка</h3>
                <p>${message}</p>
                <button onclick="location.reload()" 
                        style="margin-top: 15px; padding: 10px 20px; background: white; color: #667eea; 
                               border: none; border-radius: 5px; cursor: pointer;">
                    Обновить страницу
                </button>
            `;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }
        
        // Инициализируем кнопки Telegram
        if (tg) {
            tg.MainButton.setText('Мой профиль');
            tg.MainButton.show();
            tg.MainButton.onClick(() => {
                // Уже на странице профиля
            });
        }
    </script>
</body>
</html>
