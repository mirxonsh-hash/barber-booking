<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iWant - Ваши барберы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #fff;
            line-height: 1.4;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .header {
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
            padding-top: max(15px, env(safe-area-inset-top));
        }
        
        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }
        
        .icon-btn {
            background: #222;
            border: 1px solid #333;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .icon-btn:hover {
            background: #333;
            border-color: #4a6fa5;
        }
        
        .icon-btn:active {
            transform: scale(0.95);
        }
        
        .container {
            max-width: 100%;
            padding: 0 15px;
        }
        
        .welcome-section {
            padding: 25px 0;
            text-align: center;
        }
        
        .welcome-title {
            font-size: 18px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .add-barber-btn {
            width: 100%;
            padding: 18px;
            background: #4a6fa5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(74, 111, 165, 0.3);
            -webkit-tap-highlight-color: transparent;
        }
        
        .add-barber-btn:hover {
            background: #5a7fb5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 111, 165, 0.4);
        }
        
        .add-barber-btn:active {
            transform: translateY(0);
        }
        
        .barbers-section {
            margin-top: 30px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        
        .barber-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #333;
            -webkit-tap-highlight-color: transparent;
        }
        
        .barber-card:active {
            background: #222;
            transform: scale(0.98);
        }
        
        .barber-avatar {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .barber-info {
            flex: 1;
            min-width: 0;
        }
        
        .barber-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .barber-code {
            font-size: 14px;
            color: #4a6fa5;
            background: rgba(74, 111, 165, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            font-family: 'Courier New', monospace;
            border: 1px solid rgba(74, 111, 165, 0.3);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .barber-meta {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .barber-stats {
            display: flex;
            gap: 10px;
        }
        
        .stat-item {
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .barber-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .action-btn {
            background: #222;
            border: 1px solid #333;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #aaa;
            transition: all 0.2s;
        }
        
        .action-btn:active {
            background: #333;
            color: #fff;
            transform: scale(0.95);
        }
        
        .action-btn.primary {
            background: #4a6fa5;
            color: white;
            border-color: #4a6fa5;
        }
        
        .action-btn.primary:active {
            background: #5a7fb5;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 48px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .empty-state h3 {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .fab {
            position: fixed;
            bottom: max(30px, env(safe-area-inset-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #4a6fa5;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(74, 111, 165, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 1000;
            -webkit-tap-highlight-color: transparent;
        }
        
        .fab:active {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(74, 111, 165, 0.5);
        }
        
        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid #333;
            flex-shrink: 0;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-content {
            background: #1a1a1a;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid #333;
            -webkit-overflow-scrolling: touch;
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        
        .close-modal {
            background: #222;
            border: 1px solid #333;
            font-size: 20px;
            color: #aaa;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .close-modal:active {
            background: #333;
            color: #fff;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 14px;
            background: #222;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            color: #fff;
            -webkit-appearance: none;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #4a6fa5;
        }
        
        .modal-footer {
            padding: 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-primary {
            background: #4a6fa5;
            color: white;
        }
        
        .btn-primary:active {
            background: #5a7fb5;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: #333;
            color: #fff;
            border: 1px solid #444;
        }
        
        .btn-secondary:active {
            background: #444;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }
            
            .header {
                padding: 15px;
            }
            
            .barber-card {
                padding: 15px;
            }
            
            .welcome-section {
                padding: 20px 0;
            }
            
            .modal {
                padding: 15px;
            }
            
            .modal-content {
                max-height: 85vh;
            }
            
            .fab {
                bottom: max(25px, env(safe-area-inset-bottom));
                right: 15px;
            }
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .barber-card {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Стили для скроллбара */
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .modal-content::-webkit-scrollbar-track {
            background: #222;
            border-radius: 10px;
        }
        
        .modal-content::-webkit-scrollbar-thumb {
            background: #4a6fa5;
            border-radius: 10px;
        }
        
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #5a7fb5;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #222;
            border-top: 3px solid #4a6fa5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Стили для мобильной клавиатуры */
        @media (max-height: 500px) {
            .modal-content {
                max-height: 90vh;
            }
        }
        
        /* Оптимизация для Safari */
        @supports (-webkit-touch-callout: none) {
            body {
                min-height: -webkit-fill-available;
            }
            
            .modal-content {
                max-height: -webkit-fill-available;
            }
        }
        
        /* Улучшение для маленьких экранов */
        @media (max-width: 360px) {
            .barber-card {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            
            .barber-info {
                width: 100%;
            }
            
            .barber-actions {
                width: 100%;
                justify-content: center;
            }
        }
        
        /* Улучшение видимости кнопок на телефонах */
        button, .btn, .action-btn, .icon-btn {
            min-height: 44px;
            min-width: 44px;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="icon-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="logo">iWant</div>
        <div class="profile-avatar" id="profileAvatar" onclick="openProfileModal()">
            <span id="avatarInitials">ТК</span>
        </div>
    </div>
    
    <div class="container">
        <div class="welcome-section">
            <h1 class="welcome-title">ваши барберы</h1>
            <button class="add-barber-btn" onclick="openAddBarberModal()">
                <i class="fas fa-plus"></i>
                + добавить
            </button>
        </div>
        
        <div class="barbers-section" id="barbersSection">
            <div id="loadingBarbers" class="empty-state">
                <div class="spinner"></div>
                <p>Загрузка барберов...</p>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно добавления барбера -->
    <div id="addBarberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Добавить барбера</h3>
                <button class="close-modal" onclick="closeAddBarberModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Код барбера</label>
                    <input type="text" id="barberCodeInput" class="form-input" placeholder="Введите код барбера" maxlength="20">
                </div>
                <div class="form-group">
                    <label class="form-label">Имя барбера (необязательно)</label>
                    <input type="text" id="barberNameInput" class="form-input" placeholder="Как зовут барбера?" maxlength="50">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddBarberModal()">Отмена</button>
                <button class="btn btn-primary" onclick="addBarber()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Мой профиль</h3>
                <button class="close-modal" onclick="closeProfileModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; margin-bottom: 30px;">
                    <div id="modalAvatar" style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; font-weight: 600; border: 3px solid #333;"></div>
                    <h2 id="modalUserName" style="font-size: 20px; color: #fff; margin-bottom: 5px;"></h2>
                    <p id="modalUserPhone" style="color: #aaa; font-size: 14px;"></p>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="tel" id="userPhoneInput" class="form-input" placeholder="+7 (999) 123-45-67" maxlength="20">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="clearData()">Очистить данные</button>
                <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>
    
    <button class="fab" onclick="openAddBarberModal()">
        <i class="fas fa-plus"></i>
    </button>

    <script>
        const API_BASE = 'https://barber-booking-db.onrender.com';
        let userData = null;
        let barbers = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Инициализация страницы...');
            
            // Инициализируем Telegram
            initTelegramApp();
            
            // Загружаем данные
            setTimeout(() => {
                loadUserData();
                loadBarbers();
            }, 100);
        });
        
        // ДОБАВЬ ЭТУ ФУНКЦИЮ
        function initTelegramApp() {
            // Проверяем Telegram Web App
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                console.log('✅ Telegram Web App обнаружен!');
                
                const tg = Telegram.WebApp;
                
                // Настраиваем приложение
                tg.expand();
                tg.ready();
                
                // Кнопка "Назад"
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    goBack();
                });
                
                // Получаем все данные
                const user = tg.initDataUnsafe?.user;
                const initData = tg.initData;
                
                console.log('👤 Telegram User:', user);
                console.log('🔑 Init Data доступен:', initData ? 'ДА' : 'НЕТ');
                
                if (user) {
                    // Сохраняем в localStorage
                    localStorage.setItem('telegram_user', JSON.stringify(user));
                    localStorage.setItem('telegram_user_id', user.id.toString());
                    
                    if (initData) {
                        localStorage.setItem('telegram_init_data', initData);
                        
                        // Отправляем данные на сервер
                        fetch(`${API_BASE}/api/client/profile?tg_data=${encodeURIComponent(initData)}&telegram_id=${user.id}`)
                            .then(response => response.json())
                            .then(data => {
                                console.log('📊 Ответ сервера:', data);
                                if (data.success && data.profile) {
                                    console.log('✅ Профиль сохранен на сервере');
                                }
                            })
                            .catch(error => {
                                console.error('❌ Ошибка отправки данных:', error);
                            });
                    }
                    
                    // Создаем объект пользователя
                    userData = {
                        id: user.id,
                        firstName: user.first_name || '',
                        lastName: user.last_name || '',
                        username: user.username || '',
                        photoUrl: user.photo_url,
                        phone: ''
                    };
                    
                    console.log('✅ Данные Telegram сохранены:', userData);
                    
                    // Обновляем аватар сразу
                    updateAvatar();
                    
                    // Загружаем профиль с сервера
                    loadUserProfile(user.id);
                    
                } else {
                    console.log('🌐 Telegram данные не получены');
                    loadFromLocalStorage();
                }
                
                // Настраиваем внешний вид
                tg.setHeaderColor('#4a6fa5');
                tg.setBackgroundColor('#0a0a0a');
                
            } else {
                console.log('🌐 НЕ в Telegram Web App');
                loadFromLocalStorage();
            }
        }
        
        // ДОБАВЬ ЭТУ ФУНКЦИЮ
        function openAddBarberModal() {
            const modal = document.getElementById('addBarberModal');
            if (modal) {
                modal.style.display = 'flex';
                setTimeout(() => {
                    const input = document.getElementById('barberCodeInput');
                    if (input) input.focus();
                }, 100);
            }
        }
        
        function closeAddBarberModal() {
            const modal = document.getElementById('addBarberModal');
            if (modal) {
                modal.style.display = 'none';
                const codeInput = document.getElementById('barberCodeInput');
                const nameInput = document.getElementById('barberNameInput');
                if (codeInput) codeInput.value = '';
                if (nameInput) nameInput.value = '';
            }
        }
        
        function openProfileModal() {
            const modal = document.getElementById('profileModal');
            if (modal) {
                updateProfileModal();
                modal.style.display = 'flex';
                setTimeout(() => {
                    const input = document.getElementById('userPhoneInput');
                    if (input) input.focus();
                }, 100);
            }
        }
        
        function closeProfileModal() {
            const modal = document.getElementById('profileModal');
            if (modal) modal.style.display = 'none';
        }
        
        function loadFromLocalStorage() {
            console.log('📂 Загрузка из localStorage...');
            
            const profileStr = localStorage.getItem('user_profile');
            const telegramId = localStorage.getItem('telegram_user_id');
            
            if (profileStr) {
                try {
                    userData = JSON.parse(profileStr);
                    console.log('✅ Загружено из localStorage:', userData);
                    updateAvatar();
                } catch (e) {
                    console.error('❌ Ошибка парсинга профиля:', e);
                    createDefaultUserData();
                }
            } else if (telegramId) {
                // Есть ID Telegram, но нет профиля
                loadUserProfile(telegramId);
            } else {
                // Нет ничего - создаем тестового пользователя
                createDefaultUserData();
            }
        }
        
        function createDefaultUserData() {
            userData = {
                id: 'test_user_' + Date.now(),
                firstName: 'Тестовый',
                lastName: 'Пользователь',
                username: 'test_user',
                photoUrl: '',
                phone: ''
            };
            
            localStorage.setItem('user_profile', JSON.stringify(userData));
            updateAvatar();
        }
        
        async function loadUserProfile(telegramId) {
            try {
                const response = await fetch(`${API_BASE}/api/client/profile?telegram_id=${telegramId}`);
                const data = await response.json();
                
                if (data.success && data.profile) {
                    userData = {
                        id: data.profile.telegram_id || telegramId,
                        firstName: data.profile.first_name || 'Пользователь',
                        lastName: data.profile.last_name || '',
                        username: data.profile.username || '',
                        photoUrl: data.profile.photo_url,
                        phone: data.profile.phone || ''
                    };
                    
                    localStorage.setItem('user_profile', JSON.stringify(userData));
                    console.log('✅ Профиль загружен с сервера:', userData);
                    updateAvatar();
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки профиля:', error);
            }
        }
        
        function loadUserData() {
            console.log('👤 Загружаем данные пользователя...');
            // Уже загружено в initTelegramApp или loadFromLocalStorage
        }
        
        function updateAvatar() {
            if (!userData) {
                console.warn('⚠️ Нет данных пользователя для обновления аватара');
                return;
            }
            
            const avatarElement = document.getElementById('profileAvatar');
            const initialsElement = document.getElementById('avatarInitials');
            
            if (!avatarElement || !initialsElement) {
                console.error('❌ Элементы аватара не найдены');
                return;
            }
            
            // Генерируем инициалы
            const firstName = userData.firstName || '';
            const lastName = userData.lastName || '';
            const initials = `${firstName.charAt(0)}${lastName.charAt(0)}`.toUpperCase() || 'ПК';
            
            console.log('🎨 Обновляем аватар:', { firstName, lastName, initials });
            
            initialsElement.textContent = initials;
            
            // Если есть фото, устанавливаем как фон
            if (userData.photoUrl) {
                console.log('📸 Устанавливаем фото:', userData.photoUrl);
                avatarElement.style.background = `url(${userData.photoUrl}) center/cover no-repeat`;
                initialsElement.style.display = 'none';
            } else {
                console.log('🎨 Устанавливаем цветной фон с инициалами');
                avatarElement.style.background = 'linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%)';
                initialsElement.style.display = 'flex';
            }
            
            // Обновляем модальное окно если нужно
            updateProfileModal();
        }
        
        function updateProfileModal() {
            if (!userData) return;
            
            const modalAvatar = document.getElementById('modalAvatar');
            const modalUserName = document.getElementById('modalUserName');
            const modalUserPhone = document.getElementById('modalUserPhone');
            const userPhoneInput = document.getElementById('userPhoneInput');
            
            if (modalUserName) {
                const fullName = `${userData.firstName || ''} ${userData.lastName || ''}`.trim() || 'Пользователь';
                modalUserName.textContent = fullName;
            }
            
            if (modalUserPhone) {
                modalUserPhone.textContent = userData.phone || 'Телефон не указан';
            }
            
            if (userPhoneInput) {
                userPhoneInput.value = userData.phone || '';
            }
            
            if (modalAvatar) {
                if (userData.photoUrl) {
                    modalAvatar.style.background = `url(${userData.photoUrl}) center/cover no-repeat`;
                    modalAvatar.textContent = '';
                } else {
                    const initials = `${userData.firstName?.charAt(0) || ''}${userData.lastName?.charAt(0) || ''}`.toUpperCase() || 'ПК';
                    modalAvatar.style.background = 'linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%)';
                    modalAvatar.textContent = initials;
                }
            }
        }
        
        function loadBarbers() {
            try {
                const savedBarbers = localStorage.getItem('barbers');
                if (savedBarbers) {
                    barbers = JSON.parse(savedBarbers);
                    renderBarbers();
                } else {
                    setTimeout(() => {
                        const loadingElement = document.getElementById('loadingBarbers');
                        if (loadingElement) {
                            loadingElement.style.display = 'none';
                        }
                        renderBarbers();
                    }, 1000);
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки барберов:', error);
                renderError();
            }
        }
        
        function renderBarbers() {
            const barbersSection = document.getElementById('barbersSection');
            
            if (!barbersSection) {
                console.error('❌ Не найден элемент barbersSection');
                return;
            }
            
            const loadingElement = document.getElementById('loadingBarbers');
            if (loadingElement) {
                loadingElement.style.display = 'none';
            }
            
            if (barbers.length === 0) {
                barbersSection.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <h3>Нет барберов</h3>
                        <p>Добавьте своего первого барбера, чтобы начать записываться</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            barbers.forEach(barber => {
                const firstLetter = barber.name.charAt(0).toUpperCase();
                
                html += `
                    <div class="barber-card" onclick="openBarberPanel('${barber.code}')">
                        <div class="barber-avatar">
                            ${firstLetter}
                        </div>
                        <div class="barber-info">
                            <div class="barber-name">${barber.name}</div>
                            <div class="barber-code">${barber.code}</div>
                            <div class="barber-meta">
                                <div class="barber-stats">
                                    <span class="stat-item">
                                        <i class="fas fa-calendar-check"></i>
                                        ${barber.stats.total || 0}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="barber-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); removeBarber('${barber.code}')" title="Удалить">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            barbersSection.innerHTML = html;
        }
        
        function renderError() {
            const barbersSection = document.getElementById('barbersSection');
            const loadingElement = document.getElementById('loadingBarbers');
            if (loadingElement) {
                loadingElement.style.display = 'none';
            }
            barbersSection.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h3>Ошибка загрузки</h3>
                    <p>Не удалось загрузить список барберов</p>
                    <button onclick="loadBarbers()" style="padding: 10px 20px; background: #4a6fa5; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;">
                        Попробовать снова
                    </button>
                </div>
            `;
        }
        
        function openBarberPanel(code) {
            window.location.href = `${API_BASE}/client-panel?code=${code}`;
        }
        
        async function addBarber() {
            const code = document.getElementById('barberCodeInput').value.trim();
            const name = document.getElementById('barberNameInput').value.trim();
            
            if (!code) {
                alert('Пожалуйста, введите код барбера');
                const input = document.getElementById('barberCodeInput');
                if (input) input.focus();
                return;
            }
            
            if (barbers.some(b => b.code === code)) {
                alert('Барбер с таким кодом уже добавлен');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/barber/${code}`);
                const data = await response.json();
                
                if (data.success) {
                    const barberName = name || data.barber.name || `Барбер ${code}`;
                    const newBarber = {
                        code: code,
                        name: barberName,
                        stats: {
                            total: 0,
                            upcoming: 0
                        }
                    };
                    
                    barbers.unshift(newBarber);
                    renderBarbers();
                    closeAddBarberModal();
                    
                    localStorage.setItem('barbers', JSON.stringify(barbers));
                    localStorage.setItem('last_barber_code', code);
                    
                    setTimeout(() => {
                        openBarberPanel(code);
                    }, 300);
                } else {
                    alert('Барбер с таким кодом не найден. Пожалуйста, проверьте код.');
                }
            } catch (error) {
                console.error('❌ Ошибка проверки барбера:', error);
                alert('Не удалось проверить барбера. Пожалуйста, попробуйте снова.');
            }
        }
        
        function removeBarber(barberCode) {
            if (confirm('Удалить этого барбера из вашего списка?')) {
                barbers = barbers.filter(b => b.code !== barberCode);
                renderBarbers();
                localStorage.setItem('barbers', JSON.stringify(barbers));
            }
        }
        
        async function saveProfile() {
            const phone = document.getElementById('userPhoneInput').value.trim();
            
            if (!phone) {
                alert('Пожалуйста, укажите телефон');
                const input = document.getElementById('userPhoneInput');
                if (input) input.focus();
                return;
            }
            
            if (userData) {
                userData.phone = phone;
                localStorage.setItem('user_profile', JSON.stringify(userData));
                
                if (userData.id) {
                    try {
                        await fetch(`${API_BASE}/api/client/profile/update`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                telegram_id: userData.id,
                                phone: phone,
                                first_name: userData.firstName,
                                last_name: userData.lastName,
                                username: userData.username,
                                photo_url: userData.photoUrl
                            })
                        });
                    } catch (error) {
                        console.error('❌ Ошибка сохранения профиля на сервере:', error);
                    }
                }
                
                closeProfileModal();
                updateAvatar();
                alert('Профиль сохранен!');
            }
        }
        
        function clearData() {
            if (confirm('Вы уверены, что хотите удалить все ваши данные? Это действие нельзя отменить.')) {
                localStorage.clear();
                alert('Данные очищены. Страница будет перезагружена.');
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            }
        }
        
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = API_BASE;
            }
        }
        
        document.addEventListener('click', function(event) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
        
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeAddBarberModal();
                closeProfileModal();
            }
        });
        
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
