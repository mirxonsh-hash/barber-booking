<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iWant - Ваши барберы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ТВОИ СТИЛИ ОСТАЮТСЯ БЕЗ ИЗМЕНЕНИЙ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #ffffff;
            color: #333;
            line-height: 1.4;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .header {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            padding-top: max(15px, env(safe-area-inset-top));
        }
        
        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            letter-spacing: -0.5px;
        }
        
        .icon-btn {
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        
        .icon-btn:hover {
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .welcome-section {
            padding: 25px 0;
            text-align: center;
        }
        
        .welcome-title {
            font-size: 18px;
            font-weight: 500;
            color: #666;
            margin-bottom: 20px;
        }
        
        .add-barber-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.15);
        }
        
        .add-barber-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.2);
        }
        
        .add-barber-btn:active {
            transform: translateY(0);
        }
        
        .barbers-section {
            margin-top: 30px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #000;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        
        .barber-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .barber-card:hover {
            background: #f0f2f5;
            transform: translateY(-1px);
            border-color: #e0e0e0;
        }
        
        .barber-avatar {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .barber-info {
            flex: 1;
        }
        
        .barber-name {
            font-size: 16px;
            font-weight: 600;
            color: #000;
            margin-bottom: 4px;
        }
        
        .barber-code {
            font-size: 14px;
            color: #666;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            font-family: 'Courier New', monospace;
        }
        
        .barber-meta {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .barber-stats {
            display: flex;
            gap: 10px;
        }
        
        .stat-item {
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .barber-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            background: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            background: #e8e8e8;
            color: #333;
        }
        
        .action-btn.primary {
            background: #667eea;
            color: white;
        }
        
        .action-btn.primary:hover {
            background: #5a6fd8;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-icon {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 15px;
        }
        
        .empty-state h3 {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
        }
        
        .fab {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 1000;
        }
        
        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #000;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 20px;
            color: #999;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        
        .close-modal:hover {
            background: #f5f5f5;
            color: #333;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }
        
        .modal-footer {
            padding: 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }
            
            .header {
                padding: 15px;
            }
            
            .barber-card {
                padding: 15px;
            }
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .barber-card {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Стили для скроллбара */
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .modal-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .modal-content::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }
        
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="icon-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="logo">iWant</div>
        <div class="profile-avatar" id="profileAvatar" onclick="openProfile()">
            <span id="avatarInitials">ТК</span>
        </div>
    </div>
    
    <div class="container">
        <div class="welcome-section">
            <h1 class="welcome-title">ваши барберы</h1>
            <button class="add-barber-btn" onclick="openAddBarberModal()">
                <i class="fas fa-plus"></i>
                + добавить
            </button>
        </div>
        
        <div class="barbers-section" id="barbersSection">
            <div id="loadingBarbers" class="empty-state">
                <div class="spinner" style="width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
                <p>Загрузка барберов...</p>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно добавления барбера -->
    <div id="addBarberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Добавить барбера</h3>
                <button class="close-modal" onclick="closeAddBarberModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Код барбера</label>
                    <input type="text" id="barberCode" class="form-input" placeholder="Введите код барбера" maxlength="20">
                </div>
                <div class="form-group">
                    <label class="form-label">Имя барбера (необязательно)</label>
                    <input type="text" id="barberName" class="form-input" placeholder="Как зовут барбера?" maxlength="50">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddBarberModal()">Отмена</button>
                <button class="btn btn-primary" onclick="addBarber()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Мой профиль</h3>
                <button class="close-modal" onclick="closeProfileModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; margin-bottom: 30px;">
                    <div id="modalAvatar" style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; font-weight: 600;"></div>
                    <h2 id="modalUserName" style="font-size: 20px; color: #000; margin-bottom: 5px;"></h2>
                    <p id="modalUserPhone" style="color: #666; font-size: 14px;"></p>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="tel" id="userPhoneInput" class="form-input" placeholder="+7 (999) 123-45-67" maxlength="20">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="clearData()">Очистить данные</button>
                <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>
    
    <button class="fab" onclick="openAddBarberModal()">
        <i class="fas fa-plus"></i>
    </button>

    <script>
        const API_BASE = 'https://barber-booking-db.onrender.com';
        let userData = null;
        let barbers = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Инициализация страницы...');
            
            // ПЕРВОЕ - инициализируем Telegram
            initTelegramApp();
            
            // ВТОРОЕ - загружаем данные
            setTimeout(() => {
                loadUserData();
                loadBarbers();
            }, 100);
        });
        
        function initTelegramApp() {
            // ПРОВЕРЯЕМ Telegram Web App
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                console.log('✅ Telegram Web App обнаружен!');
                
                const tg = Telegram.WebApp;
                
                // Настраиваем приложение
                tg.expand();
                tg.ready();
                
                // Кнопка "Назад"
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    goBack();
                });
                
                // ПОЛУЧАЕМ ВСЕ ДАННЫЕ
                const user = tg.initDataUnsafe?.user;
                const initData = tg.initData; // ВАЖНО: получаем полные данные
                
                console.log('👤 Telegram User:', user);
                console.log('🔑 Init Data доступен:', initData ? 'ДА' : 'НЕТ');
                
                if (user) {
                    // Сохраняем в localStorage
                    localStorage.setItem('telegram_user', JSON.stringify(user));
                    localStorage.setItem('telegram_user_id', user.id.toString());
                    
                    if (initData) {
                        localStorage.setItem('telegram_init_data', initData);
                        
                        // Отправляем данные на сервер ДЛЯ СОХРАНЕНИЯ ПРОФИЛЯ
                        fetch(`${API_BASE}/api/client/profile?tg_data=${encodeURIComponent(initData)}&telegram_id=${user.id}`)
                            .then(response => response.json())
                            .then(data => {
                                console.log('📊 Ответ сервера:', data);
                                if (data.success && data.profile) {
                                    console.log('✅ Профиль сохранен на сервере');
                                }
                            })
                            .catch(error => {
                                console.error('❌ Ошибка отправки данных:', error);
                            });
                    }
                    
                    // Создаем объект пользователя
                    userData = {
                        id: user.id,
                        firstName: user.first_name || '',
                        lastName: user.last_name || '',
                        username: user.username || '',
                        photoUrl: user.photo_url,
                        phone: ''
                    };
                    
                    console.log('✅ Данные Telegram сохранены:', userData);
                    
                    // Обновляем аватар СРАЗУ
                    updateAvatar();
                    
                    // Загружаем профиль с сервера (для телефона и других данных)
                    loadUserProfile(user.id);
                    
                } else {
                    console.log('🌐 Telegram данные не получены');
                    loadFromLocalStorage();
                }
                
                // Настраиваем внешний вид
                tg.setHeaderColor('#667eea');
                tg.setBackgroundColor('#ffffff');
                
            } else {
                console.log('🌐 НЕ в Telegram Web App');
                loadFromLocalStorage();
            }
        }
        
        function loadFromLocalStorage() {
            console.log('📂 Загрузка из localStorage...');
            
            const profileStr = localStorage.getItem('user_profile');
            const telegramId = localStorage.getItem('telegram_user_id');
            
            if (profileStr) {
                try {
                    userData = JSON.parse(profileStr);
                    console.log('✅ Загружено из localStorage:', userData);
                    updateAvatar();
                } catch (e) {
                    console.error('❌ Ошибка парсинга профиля:', e);
                    createDefaultUserData();
                }
            } else if (telegramId) {
                // Есть ID Telegram, но нет профиля
                loadUserProfile(telegramId);
            } else {
                // Нет ничего - создаем тестового пользователя
                createDefaultUserData();
            }
        }
        
        function createDefaultUserData() {
            userData = {
                id: 'test_user',
                firstName: 'Тестовый',
                lastName: 'Пользователь',
                username: 'test_user',
                photoUrl: '',
                phone: ''
            };
            
            localStorage.setItem('user_profile', JSON.stringify(userData));
            updateAvatar();
        }
        
        async function loadUserProfile(telegramId) {
            try {
                const response = await fetch(`${API_BASE}/api/client/profile?telegram_id=${telegramId}`);
                const data = await response.json();
                
                if (data.success && data.profile) {
                    userData = {
                        id: data.profile.telegram_id || telegramId,
                        firstName: data.profile.first_name || 'Пользователь',
                        lastName: data.profile.last_name || '',
                        username: data.profile.username || '',
                        photoUrl: data.profile.photo_url,
                        phone: data.profile.phone || ''
                    };
                    
                    localStorage.setItem('user_profile', JSON.stringify(userData));
                    console.log('✅ Профиль загружен с сервера:', userData);
                    updateAvatar();
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки профиля:', error);
            }
        }
        
        function loadUserData() {
            console.log('👤 Загружаем данные пользователя...');
            // Уже загружено в initTelegramApp или loadFromLocalStorage
        }
        
        function updateAvatar() {
            if (!userData) {
                console.warn('⚠️ Нет данных пользователя для обновления аватара');
                return;
            }
            
            const avatarElement = document.getElementById('profileAvatar');
            const initialsElement = document.getElementById('avatarInitials');
            
            if (!avatarElement || !initialsElement) {
                console.error('❌ Элементы аватара не найдены');
                return;
            }
            
            // Генерируем инициалы
            const firstName = userData.firstName || '';
            const lastName = userData.lastName || '';
            const initials = `${firstName.charAt(0)}${lastName.charAt(0)}`.toUpperCase() || 'ПК';
            
            console.log('🎨 Обновляем аватар:', { firstName, lastName, initials });
            
            initialsElement.textContent = initials;
            
            // Если есть фото, устанавливаем как фон
            if (userData.photoUrl) {
                console.log('📸 Устанавливаем фото:', userData.photoUrl);
                avatarElement.style.background = `url(${userData.photoUrl}) center/cover no-repeat`;
                initialsElement.style.display = 'none';
            } else {
                console.log('🎨 Устанавливаем цветной фон с инициалами');
                avatarElement.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                initialsElement.style.display = 'flex';
            }
            
            // Обновляем модальное окно если нужно
            updateProfileModal();
        }
        
        function updateProfileModal() {
            if (!userData) return;
            
            const modalAvatar = document.getElementById('modalAvatar');
            const modalUserName = document.getElementById('modalUserName');
            const modalUserPhone = document.getElementById('modalUserPhone');
            const userPhoneInput = document.getElementById('userPhoneInput');
            
            if (modalUserName) {
                const fullName = `${userData.firstName || ''} ${userData.lastName || ''}`.trim() || 'Пользователь';
                modalUserName.textContent = fullName;
            }
            
            if (modalUserPhone) {
                modalUserPhone.textContent = userData.phone || 'Телефон не указан';
            }
            
            if (userPhoneInput) {
                userPhoneInput.value = userData.phone || '';
            }
            
            if (modalAvatar) {
                if (userData.photoUrl) {
                    modalAvatar.style.background = `url(${userData.photoUrl}) center/cover no-repeat`;
                    modalAvatar.textContent = '';
                } else {
                    const initials = `${userData.firstName?.charAt(0) || ''}${userData.lastName?.charAt(0) || ''}`.toUpperCase() || 'ПК';
                    modalAvatar.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    modalAvatar.textContent = initials;
                }
            }
        }
        
        function loadBarbers() {
            try {
                const savedBarbers = localStorage.getItem('barbers');
                if (savedBarbers) {
                    barbers = JSON.parse(savedBarbers);
                    renderBarbers();
                } else {
                    setTimeout(() => {
                        document.getElementById('loadingBarbers').style.display = 'none';
                        renderBarbers();
                    }, 1000);
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки барберов:', error);
                renderError();
            }
        }
        
        function renderBarbers() {
            const barbersSection = document.getElementById('barbersSection');
            
            if (!barbersSection) {
                console.error('❌ Не найден элемент barbersSection');
                return;
            }
            
            document.getElementById('loadingBarbers').style.display = 'none';
            
            if (barbers.length === 0) {
                barbersSection.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <h3>Нет барберов</h3>
                        <p>Добавьте своего первого барбера, чтобы начать записываться</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            barbers.forEach(barber => {
                const firstLetter = barber.name.charAt(0).toUpperCase();
                
                html += `
                    <div class="barber-card" onclick="openBarberPanel('${barber.code}')">
                        <div class="barber-avatar">
                            ${firstLetter}
                        </div>
                        <div class="barber-info">
                            <div class="barber-name">${barber.name}</div>
                            <div class="barber-code">${barber.code}</div>
                            <div class="barber-meta">
                                <div class="barber-stats">
                                    <span class="stat-item">
                                        <i class="fas fa-calendar-check"></i>
                                        ${barber.stats.total || 0}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="barber-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); removeBarber('${barber.code}')" title="Удалить">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            barbersSection.innerHTML = html;
        }
        
        function renderError() {
            const barbersSection = document.getElementById('barbersSection');
            document.getElementById('loadingBarbers').style.display = 'none';
            barbersSection.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h3>Ошибка загрузки</h3>
                    <p>Не удалось загрузить список барберов</p>
                    <button onclick="loadBarbers()" style="padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;">
                        Попробовать снова
                    </button>
                </div>
            `;
        }
        
        function openBarberPanel(code) {
            window.location.href = `${API_BASE}/client-panel?code=${code}`;
        }
        
        function openAddBarberModal() {
            const modal = document.getElementById('addBarberModal');
            modal.style.display = 'flex';
            setTimeout(() => {
                document.getElementById('barberCode').focus();
            }, 100);
        }
        
        function closeAddBarberModal() {
            const modal = document.getElementById('addBarberModal');
            modal.style.display = 'none';
            document.getElementById('barberCode').value = '';
            document.getElementById('barberName').value = '';
        }
        
        async function addBarber() {
            const code = document.getElementById('barberCode').value.trim();
            const name = document.getElementById('barberName').value.trim();
            
            if (!code) {
                alert('Пожалуйста, введите код барбера');
                document.getElementById('barberCode').focus();
                return;
            }
            
            if (barbers.some(b => b.code === code)) {
                alert('Барбер с таким кодом уже добавлен');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/barber/${code}`);
                const data = await response.json();
                
                if (data.success) {
                    const barberName = name || data.barber.name || `Барбер ${code}`;
                    const newBarber = {
                        code: code,
                        name: barberName,
                        stats: {
                            total: 0,
                            upcoming: 0
                        }
                    };
                    
                    barbers.unshift(newBarber);
                    renderBarbers();
                    closeAddBarberModal();
                    
                    localStorage.setItem('barbers', JSON.stringify(barbers));
                    localStorage.setItem('last_barber_code', code);
                    
                    setTimeout(() => {
                        openBarberPanel(code);
                    }, 300);
                } else {
                    alert('Барбер с таким кодом не найден. Пожалуйста, проверьте код.');
                }
            } catch (error) {
                console.error('❌ Ошибка проверки барбера:', error);
                alert('Не удалось проверить барбера. Пожалуйста, попробуйте снова.');
            }
        }
        
        function removeBarber(barberCode) {
            if (confirm('Удалить этого барбера из вашего списка?')) {
                barbers = barbers.filter(b => b.code !== barberCode);
                renderBarbers();
                localStorage.setItem('barbers', JSON.stringify(barbers));
            }
        }
        
        function openProfile() {
            const modal = document.getElementById('profileModal');
            updateProfileModal(); // Обновляем данные перед открытием
            modal.style.display = 'flex';
            setTimeout(() => {
                const userPhoneInput = document.getElementById('userPhoneInput');
                if (userPhoneInput) userPhoneInput.focus();
            }, 100);
        }
        
        function closeProfileModal() {
            const modal = document.getElementById('profileModal');
            modal.style.display = 'none';
        }
        
        async function saveProfile() {
            const phone = document.getElementById('userPhoneInput').value.trim();
            
            if (!phone) {
                alert('Пожалуйста, укажите телефон');
                document.getElementById('userPhoneInput').focus();
                return;
            }
            
            if (userData) {
                userData.phone = phone;
                localStorage.setItem('user_profile', JSON.stringify(userData));
                
                if (userData.id) {
                    try {
                        await fetch(`${API_BASE}/api/client/profile/update`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                telegram_id: userData.id,
                                phone: phone,
                                first_name: userData.firstName,
                                last_name: userData.lastName,
                                username: userData.username,
                                photo_url: userData.photoUrl
                            })
                        });
                    } catch (error) {
                        console.error('❌ Ошибка сохранения профиля на сервере:', error);
                    }
                }
                
                closeProfileModal();
                updateAvatar();
                alert('Профиль сохранен!');
            }
        }
        
        function clearData() {
            if (confirm('Вы уверены, что хотите удалить все ваши данные? Это действие нельзя отменить.')) {
                localStorage.clear();
                alert('Данные очищены. Страница будет перезагружена.');
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            }
        }
        
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = API_BASE;
            }
        }
        
        document.addEventListener('click', function(event) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
        
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeAddBarberModal();
                closeProfileModal();
            }
        });
        
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
        <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль клиента</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/client-profile.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
</head>
<body>
    <div class="container">
        <!-- Шапка профиля -->
        <div class="profile-header">
            <div class="avatar-section" id="avatarSection">
                <div class="avatar-circle" id="profileAvatar">
                    <div class="avatar-initials" id="avatarInitials"></div>
                </div>
                <div class="avatar-info">
                    <h2 id="profileName">Загрузка...</h2>
                    <p id="profileUsername">@username</p>
                </div>
            </div>
            <button class="btn-edit" onclick="editProfile()">Редактировать</button>
        </div>

        <!-- Секция телефона -->
        <div class="info-section">
            <h3>Телефон</h3>
            <div class="info-item">
                <span id="profilePhone">Не указан</span>
                <button class="btn-icon" onclick="editPhone()">✏️</button>
            </div>
        </div>

        <!-- Секция барберов -->
        <div class="info-section">
            <div class="section-header">
                <h3>Мои барберы</h3>
                <button class="btn-add" onclick="addBarber()" id="addBarberBtn">
                    + Добавить барбера
                </button>
            </div>
            
            <!-- КОНТЕЙНЕР ДЛЯ БАРБЕРОВ (ВАЖНО!) -->
            <div id="barbers-container" class="barbers-container">
                <!-- Барберы будут загружаться сюда -->
                <div class="loading">Загрузка барберов...</div>
            </div>
            
            <!-- Сообщение, если нет барберов -->
            <div id="no-barbers-message" class="no-barbers-message" style="display: none;">
                <p>У вас пока нет добавленных барберов</p>
            </div>
        </div>

        <!-- Уведомления -->
        <div class="info-section">
            <h3>Уведомления</h3>
            <div class="toggle-item">
                <span>Напоминания о записях</span>
                <label class="switch">
                    <input type="checkbox" id="notificationsToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Модальное окно для добавления барбера -->
    <div id="addBarberModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Добавить барбера</h3>
            <p>Перейдите в Telegram-бота и найдите барбера</p>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn-primary" onclick="openTelegramBot()">Открыть Telegram</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/client-profile.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
</body>
</html>
    </script>
</body>
