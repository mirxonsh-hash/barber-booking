<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iWant - Мой профиль</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }
        
        .header {
            padding: 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .back-btn {
            background: #222;
            border: 1px solid #333;
            font-size: 20px;
            cursor: pointer;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .back-btn:hover {
            background: #333;
            border-color: #4a6fa5;
        }
        
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #222;
            border-top: 3px solid #4a6fa5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .profile-section {
            padding: 30px 20px;
            text-align: center;
            background: #1a1a1a;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            border: 3px solid #333;
        }
        
        .user-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }
        
        .user-username {
            color: #aaa;
            font-size: 16px;
        }
        
        .info-section {
            background: #1a1a1a;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0;
            border-bottom: 1px solid #333;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #333;
            color: #fff;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #aaa;
        }
        
        .info-value {
            color: #fff;
            font-weight: 500;
        }
        
        .history-section {
            background: #1a1a1a;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0;
            border-bottom: 1px solid #333;
        }
        
        .history-list {
            margin-top: 15px;
        }
        
        .history-item {
            padding: 15px;
            border-bottom: 1px solid #333;
            background: #222;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .history-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .history-date {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .history-service {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 3px;
            color: #fff;
        }
        
        .history-barber {
            font-size: 14px;
            color: #4a6fa5;
        }
        
        .history-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .status-active {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }
        
        .status-completed {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }
        
        .status-cancelled {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
        
        .no-history {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .actions {
            padding: 20px;
            background: #1a1a1a;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: #4a6fa5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:hover {
            background: #5a7fb5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 111, 165, 0.4);
        }
        
        .btn-secondary {
            background: #333;
            border: 1px solid #444;
        }
        
        .btn-secondary:hover {
            background: #444;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: #dc3545;
            background: rgba(220, 53, 69, 0.1);
            margin: 20px;
            border-radius: 8px;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
        
        .error-message h3 {
            margin-bottom: 10px;
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 15px;
            }
            
            .profile-section {
                padding: 20px;
            }
            
            .info-section, .history-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- ОСТАЛЬНОЙ HTML КОД БЕЗ ИЗМЕНЕНИЙ -->
    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="title">Мой профиль</div>
    </div>
    
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Загрузка профиля...</p>
    </div>
    
    <div id="profileContent" style="display: none;">
        <div class="profile-section">
            <div id="avatar" class="avatar"></div>
            <div id="userName" class="user-name"></div>
            <div id="userUsername" class="user-username"></div>
        </div>
        
        <div class="info-section">
            <div class="section-title">Моя информация</div>
            <div class="info-item">
                <span class="info-label">Мой барбер</span>
                <span id="myBarber" class="info-value">Не выбран</span>
            </div>
            <div class="info-item">
                <span class="info-label">Всего записей</span>
                <span id="totalAppointments" class="info-value">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Любимая услуга</span>
                <span id="favoriteService" class="info-value">Не определено</span>
            </div>
        </div>
        
        <div class="history-section">
            <div class="section-title">История записей</div>
            <div id="historyList" class="history-list">
            </div>
            <div id="noHistory" class="no-history">
                <i class="fas fa-calendar-alt" style="font-size: 48px; margin-bottom: 15px; color: #333;"></i>
                <p>У вас еще нет записей</p>
                <p style="font-size: 14px; margin-top: 10px;">Запишитесь к барберу чтобы увидеть историю</p>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn" onclick="bookAppointment()">
                <i class="fas fa-calendar-plus"></i>
                Новая запись
            </button>
            <button class="btn btn-secondary" onclick="changeBarber()">
                <i class="fas fa-exchange-alt"></i>
                Сменить барбера
            </button>
            <button class="btn btn-secondary" onclick="clearData()">
                <i class="fas fa-trash-alt"></i>
                Очистить данные
            </button>
        </div>
    </div>
    
    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <!-- JavaScript код без изменений -->
    <script>
        const API_BASE = 'https://barber-booking-db.onrender.com';
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Начинаем загрузку профиля...');
            loadProfile();
        });
        
        // ... Весь остальной JavaScript код без изменений ...
    </script>
</body>
</html>
