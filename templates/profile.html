<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iWant - Профиль барбера</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            background: linear-gradient(to right, #1a1a1a, #2d2d2d);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }
        
        .avatar-container {
            margin: 20px auto;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .avatar-letter {
            font-weight: bold;
            font-size: 48px;
        }
        
        .barber-name {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .barber-code {
            color: #ccc;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .rating {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
        }
        
        .star {
            color: gold;
        }
        
        .info-section {
            padding: 30px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        
        .info-label {
            color: #666;
        }
        
        .info-value {
            font-weight: bold;
            color: #333;
        }
        
        .action-btn {
            display: block;
            width: 100%;
            margin-top: 30px;
            padding: 18px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .action-btn i {
            font-size: 20px;
        }
        
        /* Анимация смены страниц */
        .page {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .page.slide-out {
            transform: translateX(-100%);
        }
        
        .page.slide-in {
            transform: translateX(0);
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px;
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Страница 1: Профиль -->
    <div class="container page" id="profilePage">
        <div class="header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 style="margin-bottom: 10px;">Ваш барбер</h1>
            <p>Запись к профессиональному барберу</p>
        </div>
        
        <div id="profileContent">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> Загрузка профиля...
            </div>
        </div>
    </div>
    
    <!-- Страница 2: Расписание -->
    <div class="container page hidden" id="schedulePage">
        <div class="header">
            <button class="back-btn" onclick="goToProfile()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1>Выберите время</h1>
            <p>Запись к <span id="scheduleBarberName">Александру</span></p>
        </div>
        
        <div style="padding: 30px;">
            <div style="text-align: center; margin: 30px 0;">
                <div style="position: relative; width: 200px; height: 200px; margin: 0 auto;">
                    <svg width="200" height="200" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="90" fill="none" stroke="#f0f0f0" stroke-width="20"/>
                        <circle cx="100" cy="100" r="90" fill="none" stroke="#667eea" stroke-width="20"
                                stroke-dasharray="565.48" stroke-dashoffset="508.93"
                                stroke-linecap="round" transform="rotate(-90 100 100)"/>
                        <text x="100" y="95" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">10%</text>
                        <text x="100" y="125" text-anchor="middle" font-size="14" fill="#666">заполнено</text>
                    </svg>
                    
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                        <div style="font-size: 14px; color: #666;">Доступно</div>
                        <div style="font-size: 24px; font-weight: bold; color: #333;">18:30</div>
                        <div style="font-size: 12px; color: #888;">из 20 часов</div>
                    </div>
                </div>
                
                <div style="margin-top: 30px;">
                    <h3>Статистика загрузки</h3>
                    <div style="display: flex; justify-content: center; gap: 30px; margin-top: 20px;">
                        <div style="text-align: center;">
                            <div style="font-size: 32px; font-weight: bold; color: #667eea;">1.5%</div>
                            <div style="font-size: 14px; color: #666;">Отмен</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 32px; font-weight: bold; color: #28a745;">98.5%</div>
                            <div style="font-size: 14px; color: #666">Выполнено</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: 30px;">
                <h3 style="margin-bottom: 20px;">Ближайшие свободные даты</h3>
                <div id="availableDates">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i> Загрузка расписания...
                    </div>
                </div>
            </div>
            
            <button class="action-btn" onclick="confirmBooking()" style="margin-top: 30px;">
                <i class="fas fa-check-circle"></i> Подтвердить выбор
            </button>
        </div>
    </div>

    <script>
        // Получаем код барбера из URL
        const urlParams = new URLSearchParams(window.location.search);
        const barberCode = urlParams.get('code') || 'barber';
        
        let barberData = null;
        let selectedDate = null;
        let selectedTime = null;
        
        // Загружаем данные барбера при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadBarberProfile(barberCode);
        });
        
        async function loadBarberProfile(code) {
            try {
                const response = await fetch(`/api/barber/${code}`);
                const result = await response.json();
                
                const profileContent = document.getElementById('profileContent');
                
                if (result.success) {
                    barberData = result.barber;
                    displayBarberProfile(barberData);
                } else {
                    profileContent.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-circle"></i> ${result.error || 'Барбер не найден'}
                        </div>
                        <div style="text-align: center; margin-top: 20px;">
                            <a href="/client-login" style="color: #667eea;">← Попробовать другой код</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Ошибка загрузки профиля:', error);
                showDemoProfile(code);
            }
        }
        
        function displayBarberProfile(barber) {
            const firstLetter = barber.name ? barber.name.charAt(0).toUpperCase() : 'Б';
            const profileHTML = `
                <div class="avatar-container" id="avatar">
                    <span class="avatar-letter">${firstLetter}</span>
                </div>
                
                <div style="text-align: center; margin-bottom: 20px;">
                    <div class="barber-name">${barber.name || 'Барбер'}</div>
                    <div class="barber-code">Код: ${barber.code}</div>
                    <div class="rating">
                        <i class="fas fa-star star"></i>
                        <i class="fas fa-star star"></i>
                        <i class="fas fa-star star"></i>
                        <i class="fas fa-star star"></i>
                        <i class="fas fa-star-half-alt star"></i>
                        <span style="margin-left: 5px;">4.8 (124 отзыва)</span>
                    </div>
                </div>
                
                <div class="info-section">
                    <div class="info-item">
                        <span class="info-label">Стаж работы</span>
                        <span class="info-value">7 лет</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Специализация</span>
                        <span class="info-value">Мужские стрижки, Бритьё</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Среднее время</span>
                        <span class="info-value">45 минут</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Работает с</span>
                        <span class="info-value">2016 года</span>
                    </div>
                    
                    <button class="action-btn" onclick="openSchedulePage()">
                        <i class="fas fa-calendar-alt"></i> Выбрать время записи
                    </button>
                </div>
            `;
            
            document.getElementById('profileContent').innerHTML = profileHTML;
        }
        
        function showDemoProfile(code) {
            const demoBarber = {
                name: "Александр Барбер",
                code: code,
                id: 1
            };
            
            barberData = demoBarber;
            displayBarberProfile(demoBarber);
            
            // Добавляем демо-подпись
            const profileContent = document.getElementById('profileContent');
            const infoSection = profileContent.querySelector('.info-section');
            infoSection.innerHTML += `
                <div style="text-align: center; margin-top: 15px; font-size: 12px; color: #888;">
                    <i class="fas fa-info-circle"></i> Демо-режим: данные загружены локально
                </div>
            `;
        }
        
        function goBack() {
            window.location.href = '/client-login';
        }
        
        function openSchedulePage() {
            if (!barberData) return;
            
            document.getElementById('scheduleBarberName').textContent = 
                barberData.name ? barberData.name.split(' ')[0] : 'Барберу';
            
            const profilePage = document.getElementById('profilePage');
            const schedulePage = document.getElementById('schedulePage');
            
            profilePage.classList.add('slide-out');
            
            setTimeout(() => {
                profilePage.classList.add('hidden');
                schedulePage.classList.remove('hidden');
                schedulePage.classList.add('slide-in');
                loadSchedule();
            }, 300);
        }
        
        function goToProfile() {
            const profilePage = document.getElementById('profilePage');
            const schedulePage = document.getElementById('schedulePage');
            
            schedulePage.classList.remove('slide-in');
            schedulePage.classList.add('slide-out');
            
            setTimeout(() => {
                schedulePage.classList.add('hidden');
                profilePage.classList.remove('hidden');
                profilePage.classList.remove('slide-out');
            }, 300);
        }
        
        function loadSchedule() {
            const availableDates = document.getElementById('availableDates');
            
            // Демо-расписание
            const dates = [
                { date: new Date().toISOString().split('T')[0], day: 'Сегодня', times: ['14:00', '15:30', '17:00', '18:30'] },
                { date: new Date(Date.now() + 86400000).toISOString().split('T')[0], day: 'Завтра', times: ['10:00', '11:30', '13:00', '14:30'] },
                { date: new Date(Date.now() + 172800000).toISOString().split('T')[0], day: new Date(Date.now() + 172800000).toLocaleDateString('ru-RU', { weekday: 'short' }), times: ['12:00', '13:30', '15:00', '16:30'] }
            ];
            
            let html = '';
            dates.forEach(dateInfo => {
                html += `
                    <div style="background: #f8f9fa; border-radius: 10px; padding: 15px; margin-bottom: 15px;">
                        <div style="font-weight: bold; margin-bottom: 10px;">${dateInfo.day}</div>
                        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                `;
                
                dateInfo.times.forEach(time => {
                    html += `
                        <button style="padding: 8px 15px; background: white; border: 2px solid #667eea; 
                                border-radius: 8px; color: #667eea; font-weight: bold; cursor: pointer; transition: all 0.3s;"
                                onmouseover="this.style.background='#f0f4ff'"
                                onmouseout="if(this.style.background !== '#667eea') this.style.background='white'"
                                onclick="selectTime('${dateInfo.date}', '${time}', this)">
                            ${time}
                        </button>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            availableDates.innerHTML = html;
        }
        
        function selectTime(date, time, button) {
            selectedDate = date;
            selectedTime = time;
            
            // Сбрасываем все кнопки
            document.querySelectorAll('#availableDates button').forEach(btn => {
                btn.style.background = 'white';
                btn.style.color = '#667eea';
            });
            
            // Подсвечиваем выбранную
            button.style.background = '#667eea';
            button.style.color = 'white';
        }
        
        function confirmBooking() {
            if (!selectedDate || !selectedTime) {
                alert('Пожалуйста, выберите время!');
                return;
            }
            
            const barberName = barberData ? barberData.name : 'Барбер';
            const dateStr = new Date(selectedDate).toLocaleDateString('ru-RU');
            
            alert(`✅ Запись подтверждена!\n\nБарбер: ${barberName}\nДата: ${dateStr}\nВремя: ${selectedTime}\n\nС вами свяжется администратор для подтверждения.`);
            
            // В реальности здесь будет отправка на сервер
            setTimeout(() => {
                goToProfile();
            }, 1500);
        }
    </script>
</body>
</html>
