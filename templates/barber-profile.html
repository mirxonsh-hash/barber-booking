<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Профиль | iWant Панель барбера</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Основные стили из barber-panel.html */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; width: 100vw; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .glass-effect { background: rgba(26, 26, 26, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1); border-radius: 12px; }
        
        .header { padding: 20px 0; position: sticky; top: 0; z-index: 1000; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo i { color: #4a6fa5; }
        .nav-menu { display: flex; gap: 15px; align-items: center; }
        .nav-item { padding: 10px 20px; border-radius: 8px; text-decoration: none; color: #aaa; transition: all 0.3s; backdrop-filter: blur(10px); background: rgba(26, 26, 26, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-item:hover, .nav-item.active { background: rgba(74, 111, 165, 0.3); color: #fff; border-color: rgba(74, 111, 165, 0.5); }
        
        .section-title { font-size: 24px; margin: 30px 0 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
        
        /* Профиль */
        .profile-container { display: grid; grid-template-columns: 300px 1fr; gap: 30px; margin: 20px 0; }
        
        .profile-sidebar { padding: 30px; text-align: center; }
        .avatar-container { position: relative; margin-bottom: 20px; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(135deg, #4a6fa5, #3a5a80); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 48px; color: white; overflow: hidden; border: 3px solid rgba(74, 111, 165, 0.3); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-change { position: absolute; bottom: 10px; right: calc(50% - 75px + 50px); background: rgba(74, 111, 165, 0.8); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid rgba(255, 255, 255, 0.2); }
        .avatar-change:hover { background: rgba(74, 111, 165, 1); }
        
        .barber-name { font-size: 22px; font-weight: 600; margin-bottom: 5px; color: #fff; }
        .barber-code { color: #4a6fa5; font-size: 16px; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 25px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 20px; font-weight: bold; color: #4a6fa5; }
        .stat-label { font-size: 12px; color: #aaa; }
        
        .profile-content { padding: 30px; }
        .form-group { margin-bottom: 25px; }
        .form-label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; font-weight: 500; }
        .form-input { width: 100%; padding: 12px 15px; border-radius: 8px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; font-size: 16px; transition: all 0.3s; }
        .form-input:focus { outline: none; border-color: rgba(74, 111, 165, 0.5); box-shadow: 0 0 0 2px rgba(74, 111, 165, 0.2); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        /* Кнопки */
        .action-buttons { display: flex; gap: 15px; margin-top: 30px; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: rgba(74, 111, 165, 0.3); color: #fff; border: 1px solid rgba(74, 111, 165, 0.5); }
        .btn-primary:hover { background: rgba(74, 111, 165, 0.5); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-danger { background: rgba(220, 53, 69, 0.2); color: #ff6b6b; border: 1px solid rgba(220, 53, 69, 0.3); }
        .btn-danger:hover { background: rgba(220, 53, 69, 0.3); }
        
        /* Копирование кода */
        .code-section { margin-top: 30px; padding: 20px; }
        .code-display { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .code-value { font-size: 20px; font-weight: bold; color: #4a6fa5; font-family: 'Courier New', monospace; padding: 10px 15px; background: rgba(0, 0, 0, 0.3); border-radius: 8px; flex-grow: 1; }
        
        .footer { margin-top: 40px; padding: 30px 0; text-align: center; color: #666; font-size: 14px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Модальное окно для аватара */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); z-index: 10000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-container { background: rgba(26, 26, 26, 0.95); backdrop-filter: blur(20px); border-radius: 20px; padding: 30px; max-width: 500px; width: 100%; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .modal-title { font-size: 20px; font-weight: 600; color: #fff; }
        .close-modal { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #aaa; cursor: pointer; background: rgba(255, 255, 255, 0.1); transition: all 0.3s; }
        .close-modal:hover { background: rgba(74, 111, 165, 0.3); color: #fff; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        
        /* Адаптивность */
        @media (max-width: 992px) {
            .profile-container { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 15px; }
            .nav-menu { width: 100%; justify-content: center; flex-wrap: wrap; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .action-buttons { flex-direction: column; }
            .code-display { flex-direction: column; align-items: stretch; }
        }
        
        @media (max-width: 480px) {
            .nav-menu { flex-direction: column; width: 100%; }
            .nav-item { width: 100%; text-align: center; }
            .container { padding: 0 15px; }
            .avatar { width: 120px; height: 120px; font-size: 36px; }
        }
    </style>
</head>
