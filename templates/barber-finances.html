<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы | iWant Панель барбера</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Основные стили из barber-panel.html */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; width: 100vw; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .glass-effect { background: rgba(26, 26, 26, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1); border-radius: 12px; }
        
        .header { padding: 20px 0; position: sticky; top: 0; z-index: 1000; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo i { color: #4a6fa5; }
        .nav-menu { display: flex; gap: 15px; align-items: center; }
        .nav-item { padding: 10px 20px; border-radius: 8px; text-decoration: none; color: #aaa; transition: all 0.3s; backdrop-filter: blur(10px); background: rgba(26, 26, 26, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-item:hover, .nav-item.active { background: rgba(74, 111, 165, 0.3); color: #fff; border-color: rgba(74, 111, 165, 0.5); }
        
        .section-title { font-size: 24px; margin: 30px 0 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
        
        /* Финансовые карточки */
        .finance-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }
        .finance-card { padding: 25px; text-align: center; }
        .finance-icon { font-size: 32px; margin-bottom: 15px; color: #4a6fa5; }
        .finance-amount { font-size: 36px; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .finance-label { color: #aaa; font-size: 14px; }
        
        /* Периоды */
        .period-selector { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .period-btn { padding: 8px 20px; border-radius: 20px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #aaa; cursor: pointer; transition: all 0.3s; }
        .period-btn.active { background: rgba(74, 111, 165, 0.3); color: #fff; border-color: rgba(74, 111, 165, 0.5); }
        .period-btn:hover { background: rgba(255, 255, 255, 0.2); }
        
        /* Диаграмма */
        .chart-container { padding: 20px; margin: 20px 0; height: 300px; }
        #financeChart { width: 100%; height: 100%; }
        
        /* Таблица доходов */
        .income-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .income-table th { text-align: left; padding: 15px; color: #aaa; font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .income-table td { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .income-table tr:hover { background: rgba(255, 255, 255, 0.05); }
        
        .footer { margin-top: 40px; padding: 30px 0; text-align: center; color: #666; font-size: 14px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        
        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 15px; }
            .nav-menu { width: 100%; justify-content: center; flex-wrap: wrap; }
            .finance-cards { grid-template-columns: 1fr; }
            .income-table { display: block; overflow-x: auto; }
        }
        
        @media (max-width: 480px) {
            .nav-menu { flex-direction: column; width: 100%; }
            .nav-item { width: 100%; text-align: center; }
            .container { padding: 0 15px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Хедер -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">
                    <i class="fas fa-cut"></i> iWant
                </a>
                <div class="nav-menu">
                    <a href="barber-panel.html" class="nav-item">
                        <i class="fas fa-tachometer-alt"></i> Панель
                    </a>
                    <a href="barber-bookings.html" class="nav-item">
                        <i class="fas fa-calendar-alt"></i> Записи
                    </a>
                    <a href="barber-finances.html" class="nav-item active">
                        <i class="fas fa-chart-line"></i> Финансы
                    </a>
                    <a href="barber-schedule.html" class="nav-item">
                        <i class="fas fa-clock"></i> График
                    </a>
                    <a href="barber-services.html" class="nav-item">
                        <i class="fas fa-scissors"></i> Услуги
                    </a>
                    <a href="barber-profile.html" class="nav-item">
                        <i class="fas fa-user"></i> Профиль
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="section-title">
            <i class="fas fa-chart-line"></i> Финансы
        </h1>
        
        <!-- Финансовые карточки -->
        <div class="finance-cards">
            <div class="finance-card glass-effect">
                <div class="finance-icon">
                    <i class="fas fa-calendar-day"></i>
                </div>
                <div class="finance-amount" id="todayIncome">0 руб.</div>
                <div class="finance-label">За сегодня</div>
            </div>
            
            <div class="finance-card glass-effect">
                <div class="finance-icon">
                    <i class="fas fa-calendar-week"></i>
                </div>
                <div class="finance-amount" id="weekIncome">0 руб.</div>
                <div class="finance-label">За неделю</div>
            </div>
            
            <div class="finance-card glass-effect">
                <div class="finance-icon">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="finance-amount" id="monthIncome">0 руб.</div>
                <div class="finance-label">За месяц</div>
            </div>
            
            <div class="finance-card glass-effect">
                <div class="finance-icon">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="finance-amount" id="totalIncome">0 руб.</div>
                <div class="finance-label">Всего заработано</div>
            </div>
        </div>
        
        <!-- Периоды -->
        <div class="period-selector">
            <button class="period-btn active" onclick="changePeriod('day')">День</button>
            <button class="period-btn" onclick="changePeriod('week')">Неделя</button>
            <button class="period-btn" onclick="changePeriod('month')">Месяц</button>
            <button class="period-btn" onclick="changePeriod('year')">Год</button>
        </div>
        
        <!-- Диаграмма -->
        <div class="chart-container glass-effect">
            <canvas id="financeChart"></canvas>
        </div>
        
        <!-- Таблица доходов -->
        <h2 class="section-title">
            <i class="fas fa-list-alt"></i> Детализация доходов
        </h2>
        <div class="glass-effect" style="padding: 20px; overflow-x: auto;">
            <table class="income-table">
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Клиент</th>
                        <th>Услуга</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="incomeTableBody">
                    <!-- Данные будут загружены через JavaScript -->
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 30px; color: #666;">
                            <i class="fas fa-spinner fa-spin"></i> Загрузка данных...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Система онлайн-записи к барберам</p>
            <p>© 2026 iWant. Все права защищены.</p>
        </div>
    </footer>

    <script>
        let financeChart;
        
        // Mock данные финансов
        const mockFinances = {
            day: {
                income: 45000,
                chartData: [5000, 15000, 10000, 15000],
                chartLabels: ['9:00-12:00', '12:00-15:00', '15:00-18:00', '18:00-21:00'],
                transactions: [
                    { date: '20.03.2024 10:30', client: 'Иван Петров', service: 'Стрижка', amount: 15000, status: 'completed' },
                    { date: '20.03.2024 14:00', client: 'Алексей Сидоров', service: 'Борода', amount: 10000, status: 'completed' },
                    { date: '20.03.2024 16:30', client: 'Максим Иванов', service: 'Стрижка + Борода', amount: 20000, status: 'completed' }
                ]
            },
            week: {
                income: 185000,
                chartData: [45000, 60000, 40000, 40000],
                chartLabels: ['Пн', 'Вт', 'Ср', 'Чт'],
                transactions: [
                    { date: '18.03.2024 11:00', client: 'Андрей Новиков', service: 'Отец + Сын', amount: 25000, status: 'completed' },
                    { date: '19.03.2024 15:30', client: 'Дмитрий Козлов', service: 'Стрижка', amount: 15000, status: 'completed' },
                    { date: '20.03.2024 10:30', client: 'Иван Петров', service: 'Стрижка', amount: 15000, status: 'completed' },
                    { date: '20.03.2024 14:00', client: 'Алексей Сидоров', service: 'Борода', amount: 10000, status: 'completed' },
                    { date: '20.03.2024 16:30', client: 'Максим Иванов', service: 'Стрижка + Борода', amount: 20000, status: 'completed' },
                    { date: '21.03.2024 11:00', client: 'Сергей Смирнов', service: 'Стрижка', amount: 15000, status: 'completed' },
                    { date: '21.03.2024 14:30', client: 'Павел Волков', service: 'Борода', amount: 10000, status: 'completed' },
                    { date: '22.03.2024 12:00', client: 'Николай Орлов', service: 'Стрижка + Борода', amount: 20000, status: 'confirmed' },
                    { date: '22.03.2024 17:00', client: 'Артем Лебедев', service: 'Стрижка', amount: 15000, status: 'confirmed' }
                ]
            },
            month: {
                income: 625000,
                chartData: [185000, 220000, 220000],
                chartLabels: ['1-10 марта', '11-20 марта', '21-31 марта'],
                transactions: [
                    { date: '05.03.2024 13:00', client: 'Игорь Морозов', service: 'Стрижка', amount: 15000, status: 'completed' },
                    { date: '07.03.2024 16:00', client: 'Владимир Зайцев', service: 'Борода', amount: 10000, status: 'completed' },
                    { date: '12.03.2024 11:30', client: 'Евгений Егоров', service: 'Стрижка + Борода', amount: 20000, status: 'completed' },
                    { date: '15.03.2024 14:00', client: 'Анатолий Павлов', service: 'Стрижка', amount: 15000, status: 'completed' },
                    { date: '18.03.2024 11:00', client: 'Андрей Новиков', service: 'Отец + Сын', amount: 25000, status: 'completed' },
                    { date: '19.03.2024 15:30', client: 'Дмитрий Козлов', service: 'Стрижка', amount: 15000, status: 'completed' },
                    { date: '20.03.2024 10:30', client: 'Иван Петров', service: 'Стрижка', amount: 15000, status: 'completed' },
                    { date: '20.03.2024 14:00', client: 'Алексей Сидоров', service: 'Борода', amount: 10000, status: 'completed' },
                    { date: '20.03.2024 16:30', client: 'Максим Иванов', service: 'Стрижка + Борода', amount: 20000, status: 'completed' }
                ]
            },
            year: {
                income: 4850000,
                chartData: [625000, 550000, 600000, 575000, 650000, 700000, 600000, 550000],
                chartLabels: ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг'],
                transactions: []
            }
        };
        
        function initChart() {
            const ctx = document.getElementById('financeChart').getContext('2d');
            
            financeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: mockFinances.day.chartLabels,
                    datasets: [{
                        label: 'Доход, руб.',
                        data: mockFinances.day.chartData,
                        borderColor: '#4a6fa5',
                        backgroundColor: 'rgba(74, 111, 165, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#fff'
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: '#aaa'
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: '#aaa',
                                callback: function(value) {
                                    return value + ' руб.';
                                }
                            }
                        }
                    }
                }
            });
        }
        
        function loadFinanceData(period = 'day') {
            const data = mockFinances[period];
            
            // Обновляем карточки
            document.getElementById('todayIncome').textContent = formatCurrency(mockFinances.day.income);
            document.getElementById('weekIncome').textContent = formatCurrency(mockFinances.week.income);
            document.getElementById('monthIncome').textContent = formatCurrency(mockFinances.month.income);
            document.getElementById('totalIncome').textContent = formatCurrency(mockFinances.year.income);
            
            // Обновляем диаграмму
            if (financeChart) {
                financeChart.data.labels = data.chartLabels;
                financeChart.data.datasets[0].data = data.chartData;
                financeChart.update();
            }
            
            // Обновляем таблицу
            const tableBody = document.getElementById('incomeTableBody');
            if (data.transactions.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 30px; color: #666;">
                            <i class="far fa-chart-bar"></i>
                            <p>Нет данных за выбранный период</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            let html = '';
            data.transactions.forEach(transaction => {
                const statusClass = transaction.status === 'completed' ? 'status-completed' : 
                                   transaction.status === 'confirmed' ? 'status-confirmed' : 'status-new';
                const statusText = transaction.status === 'completed' ? 'Выполнено' :
                                  transaction.status === 'confirmed' ? 'Подтверждено' : 'Новая';
                
                html += `
                    <tr>
                        <td>${transaction.date}</td>
                        <td>${transaction.client}</td>
                        <td>${transaction.service}</td>
                        <td><strong>${formatCurrency(transaction.amount)}</strong></td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    </tr>
                `;
            });
            
            tableBody.innerHTML = html;
        }
        
        function changePeriod(period) {
            // Обновляем активную кнопку
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            loadFinanceData(period);
        }
        
        function formatCurrency(amount) {
            return amount.toLocaleString('ru-RU') + ' руб.';
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            loadFinanceData('day');
        });
    </script>
</body>
</html>
