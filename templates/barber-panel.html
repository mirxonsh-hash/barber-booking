<script>
    const API_BASE = 'https://barber-booking-db.onrender.com';
    let currentToken = null;
    
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Панель барбера загружается...');
        initApp();
    });
    
    async function initApp() {
        try {
            showPreloader(true);  // ЭТА ФУНКЦИЯ НУЖНА
            
            // Получаем токен из разных источников
            currentToken = getTokenFromSources();
            
            if (!currentToken) {
                console.log('❌ Токен не найден');
                showLoginPrompt();
                return;
            }
            
            // Проверяем авторизацию
            const barberData = await checkAuth(currentToken);
            
            if (barberData) {
                // Успешная авторизация
                saveBarberData(barberData);
                updateUI(barberData);
                await loadAllData();
            } else {
                // Неудачная авторизация
                showLoginPrompt();
            }
        } catch (error) {
            console.error('❌ Ошибка инициализации:', error);
            showErrorMessage('Ошибка загрузки данных');
        } finally {
            showPreloader(false);  // И ЭТА ТОЖЕ
        }
    }
    
    // ДОБАВЬ ЭТУ ФУНКЦИЮ
    function showPreloader(show) {
        const preloader = document.getElementById('preloader');
        const content = document.querySelector('.content');
        
        if (preloader) {
            preloader.style.display = show ? 'flex' : 'none';
        }
        
        if (content) {
            content.classList.toggle('hidden', show);
        }
    }
    
    function getTokenFromSources() {
        // Проверяем разные источники токена в порядке приоритета
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        const tokenFromStorage = localStorage.getItem('barber_token');
        
        if (tokenFromUrl) {
            // Сохраняем токен из URL
            localStorage.setItem('barber_token', tokenFromUrl);
            // Убираем токен из URL для безопасности
            window.history.replaceState({}, document.title, window.location.pathname);
            return tokenFromUrl;
        }
        
        return tokenFromStorage;
    }
    
    async function checkAuth(token) {
        try {
            console.log('🔍 Проверяем авторизацию...');
            
            const response = await fetch(`${API_BASE}/api/barber/check`, {
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Accept': 'application/json'
                }
            });
            
            if (response.status === 401) {
                // Неавторизован
                localStorage.removeItem('barber_token');
                return null;
            }
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            
            if (data.authenticated && data.barber) {
                return data.barber;
            }
            
            return null;
        } catch (error) {
            console.error('❌ Ошибка проверки авторизации:', error);
            throw error;
        }
    }
    
    function saveBarberData(barber) {
        localStorage.setItem('barber_code', barber.code || '');
        localStorage.setItem('barber_name', barber.name || '');
        localStorage.setItem('barber_id', barber.id || '');
    }
    
    function updateUI(barber) {
        // Показываем контент
        const content = document.querySelector('.content');
        if (content) {
            content.classList.remove('hidden');
        }
        
        // Обновляем информацию
        const barberName = document.getElementById('barberName');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const barberCode = document.getElementById('barberCode');
        const currentCode = document.getElementById('currentCode');
        
        if (barberName && barber.name) {
            barberName.textContent = barber.name;
        }
        
        if (welcomeMessage && barber.name) {
            welcomeMessage.innerHTML = `<i class="fas fa-user-tie"></i> Добро пожаловать, ${barber.name}!`;
        }
        
        if (barberCode && barber.code) {
            barberCode.textContent = barber.code;
        }
        
        if (currentCode && barber.code) {
            currentCode.textContent = barber.code;
        }
    }
    
    async function loadAllData() {
        try {
            // Параллельно загружаем записи и статистику
            const [appointmentsResponse, statsResponse] = await Promise.allSettled([
                fetch(`${API_BASE}/api/barber/appointments`, {
                    headers: {
                        'Authorization': 'Bearer ' + currentToken,
                        'Accept': 'application/json'
                    }
                }),
                fetch(`${API_BASE}/api/barber/stats`, {
                    headers: {
                        'Authorization': 'Bearer ' + currentToken,
                        'Accept': 'application/json'
                    }
                })
            ]);
            
            // Обрабатываем записи
            if (appointmentsResponse.status === 'fulfilled' && 
                appointmentsResponse.value.ok) {
                const appointmentsData = await appointmentsResponse.value.json();
                displayAppointments(appointmentsData.appointments || []);
            } else {
                throw new Error('Не удалось загрузить записи');
            }
            
            // Обрабатываем статистику
            if (statsResponse.status === 'fulfilled' && 
                statsResponse.value.ok) {
                const statsData = await statsResponse.value.json();
                updateStatsFromServer(statsData);
            } else {
                // Если эндпоинт статистики не работает, считаем локально
                const appointmentsData = await appointmentsResponse.value.json();
                updateStats(appointmentsData.appointments || []);
            }
            
        } catch (error) {
            console.error('❌ Ошибка загрузки данных:', error);
            throw error;
        }
    }
    
    function updateStatsFromServer(stats) {
        // Обновляем статистику с сервера
        const todayElement = document.getElementById('todayAppointments');
        const pendingElement = document.getElementById('pendingAppointments');
        const totalElement = document.getElementById('totalAppointments');
        const rateElement = document.getElementById('completionRate');
        
        if (todayElement) todayElement.textContent = stats.today || 0;
        if (pendingElement) pendingElement.textContent = stats.pending || 0;
        if (totalElement) totalElement.textContent = stats.total || 0;
        if (rateElement) rateElement.textContent = `${stats.completionRate || 0}%`;
    }
    
    function displayAppointments(appointments) {
        const container = document.getElementById('appointmentsList');
        
        if (!container) {
            console.error('Контейнер записей не найден');
            return;
        }
        
        if (!appointments || appointments.length === 0) {
            const barberCode = localStorage.getItem('barber_code') || 'barber';
            container.innerHTML = `
                <div class="no-appointments">
                    <h3>📭 Записей пока нет</h3>
                    <p>Когда клиенты будут записываться через ваш код, записи появятся здесь</p>
                    <p><small>Ваш код: <strong id="currentCode">${barberCode}</strong></small></p>
                    <div class="how-to-attract">
                        <h4>🎯 Как привлекать клиентов:</h4>
                        <ol>
                            <li>Разместите свой код на визитках</li>
                            <li>Поделитесь кодом в социальных сетях</li>
                            <li>Расскажите клиентам о онлайн-записи</li>
                        </ol>
                    </div>
                </div>
            `;
            return;
        }
        
        // Сортируем записи: сначала новые, потом ожидающие
        const sortedAppointments = [...appointments].sort((a, b) => {
            if (a.status === 'active' && b.status !== 'active') return -1;
            if (a.status !== 'active' && b.status === 'active') return 1;
            return new Date(b.date) - new Date(a.date);
        });
        
        let html = `
            <table>
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Дата и время</th>
                        <th>Клиент</th>
                        <th>Телефон</th>
                        <th>Услуга</th>
                        <th>Цена</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        sortedAppointments.forEach((app, index) => {
            const statusClass = `status-${app.status || 'pending'}`;
            const date = app.date ? new Date(app.date) : new Date();
            const dateStr = date.toLocaleDateString('ru-RU');
            const timeStr = app.time || '';
            
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>
                        <div>${dateStr}</div>
                        <small style="color: #666;">${timeStr}</small>
                    </td>
                    <td><strong>${app.client_name || 'Клиент'}</strong></td>
                    <td>
                        <a href="tel:${app.client_phone || ''}" style="color: #4a6fa5; text-decoration: none;">
                            <i class="fas fa-phone"></i> ${app.client_phone || ''}
                        </a>
                    </td>
                    <td>${app.service_name || ''}</td>
                    <td><strong>${app.price || '0'} руб.</strong></td>
                    <td><span class="status ${statusClass}">${getStatusText(app.status)}</span></td>
                    <td>
                        ${getActionButtons(app)}
                    </td>
                </tr>
            `;
        });
        
        html += '</tbody></table>';
        container.innerHTML = html;
    }
    
    function getActionButtons(appointment) {
        const { id, status } = appointment;
        
        switch(status) {
            case 'active':
            case 'pending':
                return `
                    <button onclick="updateStatus(${id}, 'confirmed')" class="action-btn btn-confirm">
                        <i class="fas fa-check"></i> Подтвердить
                    </button>
                    <button onclick="updateStatus(${id}, 'cancelled')" class="action-btn btn-cancel">
                        <i class="fas fa-times"></i> Отменить
                    </button>
                `;
            case 'confirmed':
                return `
                    <button onclick="updateStatus(${id}, 'completed')" class="action-btn btn-complete">
                        <i class="fas fa-check-double"></i> Выполнено
                    </button>
                    <button onclick="updateStatus(${id}, 'cancelled')" class="action-btn btn-cancel">
                        <i class="fas fa-times"></i> Отменить
                    </button>
                `;
            case 'completed':
                return `<span style="color: #28a745;"><i class="fas fa-check-circle"></i> Завершено</span>`;
            case 'cancelled':
                return `<span style="color: #dc3545;"><i class="fas fa-ban"></i> Отменено</span>`;
            default:
                return `
                    <button onclick="updateStatus(${id}, 'confirmed')" class="action-btn btn-confirm">
                        <i class="fas fa-check"></i> Подтвердить
                    </button>
                    <button onclick="updateStatus(${id}, 'cancelled')" class="action-btn btn-cancel">
                        <i class="fas fa-times"></i> Отменить
                    </button>
                `;
        }
    }
    
    async function updateStatus(appointmentId, newStatus) {
        if (!confirm(`Изменить статус записи #${appointmentId} на "${getStatusText(newStatus)}"?`)) {
            return;
        }
        
        try {
            showPreloader(true);
            
            const response = await fetch(`${API_BASE}/api/appointments/${appointmentId}/status`, {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + currentToken,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: newStatus })
            });
            
            if (response.ok) {
                const result = await response.json();
                alert(`✅ Статус изменен на "${getStatusText(newStatus)}"`);
                await loadAllData(); // Перезагружаем все данные
            } else if (response.status === 404) {
                alert('❌ Запись не найдена');
            } else if (response.status === 405) {
                // Пробуем альтернативный endpoint
                await tryAlternativeStatusUpdate(appointmentId, newStatus);
            } else {
                throw new Error(`HTTP ${response.status}`);
            }
        } catch (error) {
            console.error('❌ Ошибка обновления статуса:', error);
            alert('❌ Ошибка обновления статуса');
        } finally {
            showPreloader(false);
        }
    }
    
    async function tryAlternativeStatusUpdate(appointmentId, newStatus) {
        // Альтернативный метод обновления статуса
        try {
            const response = await fetch(`${API_BASE}/api/barber/appointments/${appointmentId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': 'Bearer ' + currentToken,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: newStatus })
            });
            
            if (response.ok) {
                alert(`✅ Статус изменен через альтернативный метод`);
                await loadAllData();
            } else {
                alert('⚠️ Функция изменения статуса временно недоступна');
            }
        } catch (error) {
            alert('❌ Ошибка сети');
        }
    }
    
    function showLoginPrompt() {
        const content = document.querySelector('.content');
        const appointmentsList = document.getElementById('appointmentsList');
        
        if (content) {
            content.classList.remove('hidden');
        }
        
        if (appointmentsList) {
            appointmentsList.innerHTML = `
                <div class="empty-state">
                    <h3>⚠️ Требуется авторизация</h3>
                    <p>Пожалуйста, войдите в систему</p>
                    <div style="margin-top: 20px;">
                        <button onclick="window.location.href='${API_BASE}/barber-login'" 
                                class="btn-primary" style="margin-right: 10px;">
                            <i class="fas fa-sign-in-alt"></i> Войти
                        </button>
                        <button onclick="window.location.href='${API_BASE}/'" 
                                class="btn-primary" style="background: #6c757d;">
                            <i class="fas fa-home"></i> На главную
                        </button>
                    </div>
                </div>
            `;
        }
    }
    
    function showErrorMessage(message) {
        const content = document.querySelector('.content');
        const appointmentsList = document.getElementById('appointmentsList');
        
        if (content) {
            content.classList.remove('hidden');
        }
        
        if (appointmentsList) {
            appointmentsList.innerHTML = `
                <div class="empty-state">
                    <h3>⚠️ Ошибка</h3>
                    <p>${message}</p>
                    <div style="margin-top: 20px;">
                        <button onclick="location.reload()" class="btn-primary" style="margin-right: 10px;">
                            <i class="fas fa-redo"></i> Обновить
                        </button>
                        <button onclick="logout()" class="btn-primary" style="background: #ff4757;">
                            <i class="fas fa-sign-out-alt"></i> Выйти
                        </button>
                    </div>
                </div>
            `;
        }
    }
    
    function logout() {
        if (confirm('Вы действительно хотите выйти?')) {
            // Очищаем все данные
            localStorage.removeItem('barber_token');
            localStorage.removeItem('barber_code');
            localStorage.removeItem('barber_name');
            localStorage.removeItem('barber_id');
            window.location.href = `${API_BASE}/barber-login`;
        }
    }
    
    function getStatusText(status) {
        const statusMap = {
            'active': 'Новая',
            'pending': 'Ожидает',
            'confirmed': 'Подтверждено',
            'completed': 'Выполнено',
            'cancelled': 'Отменено'
        };
        return statusMap[status] || 'Новая';
    }
    
    function updateStats(appointments) {
        const today = new Date().toISOString().split('T')[0];
        
        const todayCount = appointments.filter(app => app.date === today).length;
        const pendingCount = appointments.filter(app => 
            app.status === 'active' || app.status === 'pending' || app.status === 'confirmed'
        ).length;
        const totalCount = appointments.length;
        const completedCount = appointments.filter(app => app.status === 'completed').length;
        const completionRate = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
        
        const todayElement = document.getElementById('todayAppointments');
        const pendingElement = document.getElementById('pendingAppointments');
        const totalElement = document.getElementById('totalAppointments');
        const rateElement = document.getElementById('completionRate');
        
        if (todayElement) todayElement.textContent = todayCount;
        if (pendingElement) pendingElement.textContent = pendingCount;
        if (totalElement) totalElement.textContent = totalCount;
        if (rateElement) rateElement.textContent = `${completionRate}%`;
    }
    
    // Автообновление каждые 30 секунд
    let refreshInterval = setInterval(() => {
        if (currentToken) {
            console.log('🔄 Авто-обновление...');
            loadAllData().catch(console.error);
        }
    }, 30000);
    
    // Останавливаем автообновление при скрытии вкладки
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            clearInterval(refreshInterval);
        } else {
            refreshInterval = setInterval(() => {
                if (currentToken) loadAllData().catch(console.error);
            }, 30000);
            // Обновляем сразу при возвращении
            if (currentToken) loadAllData().catch(console.error);
        }
    });
    
    // Горячие клавиши
    document.addEventListener('keydown', (e) => {
        if (e.key === 'F5' || (e.key === 'r' && e.ctrlKey)) {
            e.preventDefault();
            if (currentToken) {
                console.log('🔄 Ручное обновление...');
                loadAllData().catch(console.error);
            }
        }
        
        if (e.key === 'Escape') {
            logout();
        }
    });
</script>
