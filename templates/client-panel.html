<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись к барберу | iWant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: #f8f9fa;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 20px;
            position: relative;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            position: absolute;
            top: 25px;
            left: 20px;
        }
        
        .profile-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid white;
            position: absolute;
            top: 25px;
            right: 20px;
            background: white;
        }
        
        .profile-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        
        .profile-btn .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        
        .barber-info {
            text-align: center;
            margin-top: 10px;
        }
        
        .barber-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            border: 3px solid white;
        }
        
        .barber-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .barber-code {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .booking-steps {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }
        
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .step-circle {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }
        
        .step.active .step-circle {
            background: white;
            color: #667eea;
            border-color: white;
        }
        
        .step-label {
            font-size: 12px;
            color: rgba(255,255,255,0.8);
        }
        
        .step.active .step-label {
            color: white;
            font-weight: bold;
        }
        
        .content {
            padding: 25px;
        }
        
        .step-content {
            display: none;
        }
        
        .step-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        
        .services-grid {
            display: grid;
            gap: 15px;
        }
        
        .service-card {
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .service-card:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .service-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .service-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .service-price {
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
        }
        
        .service-duration {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .date-picker {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .date-option {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .date-option:hover {
            border-color: #667eea;
        }
        
        .date-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .date-day {
            font-weight: bold;
            color: #333;
        }
        
        .date-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin: 5px 0;
        }
        
        .date-month {
            color: #666;
            font-size: 14px;
        }
        
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .time-slot {
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .time-slot:hover {
            border-color: #667eea;
        }
        
        .time-slot.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .time-slot.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f5f5f5;
            border-color: #ddd;
            color: #999;
        }
        
        .time-slot.disabled:hover {
            border-color: #ddd;
            background: #f5f5f5;
            color: #999;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        .form-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-input:focus {
            border-color: #667eea;
            outline: none;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .summary-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .summary-total {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .success-message {
            text-align: center;
            padding: 40px 20px;
        }
        
        .success-icon {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 20px;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Стили для экрана успешной записи */
        .appointment-success {
            text-align: center;
            padding: 40px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin: 20px auto;
            max-width: 600px;
            animation: fadeIn 0.5s;
        }
        
        .appointment-success-icon {
            font-size: 80px;
            color: #28a745;
            margin-bottom: 20px;
        }
        
        .appointment-details {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            margin: 20px 0;
        }
        
        .appointment-details p {
            margin: 10px 0;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        
        .appointment-details p:last-child {
            border-bottom: none;
        }
        
        .appointment-actions {
            margin-top: 30px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container" id="clientPanel">
        <!-- Шапка -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <!-- Кнопка профиля -->
            <div class="profile-btn" onclick="openProfile()">
                <img id="userAvatarSmall" src="" alt="Профиль">
                <div id="avatarPlaceholderSmall" class="avatar-placeholder">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            
            <div class="barber-info">
                <div class="barber-avatar" id="barberAvatar">Б</div>
                <div class="barber-name" id="barberName">Загрузка...</div>
                <div class="barber-code" id="barberCode">Код: </div>
            </div>
            
            <!-- Шаги -->
            <div class="booking-steps">
                <div class="step active" data-step="1">
                    <div class="step-circle">1</div>
                    <div class="step-label">Услуга</div>
                </div>
                <div class="step" data-step="2">
                    <div class="step-circle">2</div>
                    <div class="step-label">Дата</div>
                </div>
                <div class="step" data-step="3">
                    <div class="step-circle">3</div>
                    <div class="step-label">Время</div>
                </div>
                <div class="step" data-step="4">
                    <div class="step-circle">4</div>
                    <div class="step-label">Данные</div>
                </div>
            </div>
        </div>
        
        <!-- Контент -->
        <div class="content">
            <!-- Сообщение об ошибке -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- Шаг 1: Выбор услуги -->
            <div class="step-content active" id="step1">
                <h2 class="section-title">Выберите услугу</h2>
                <div class="services-grid" id="servicesList">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i> Загрузка услуг...
                    </div>
                </div>
                <button class="btn" onclick="nextStep()" id="nextBtn1" disabled>
                    Далее <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            
            <!-- Шаг 2: Выбор даты -->
            <div class="step-content" id="step2">
                <h2 class="section-title">Выберите дату</h2>
                <div class="date-picker" id="datePicker">
                    <!-- Даты будут добавлены через JS -->
                </div>
                <div class="form-group">
                    <button class="btn btn-secondary" onclick="prevStep()">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                    <button class="btn" onclick="nextStep()" id="nextBtn2" disabled>
                        Далее <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
            
            <!-- Шаг 3: Выбор времени -->
            <div class="step-content" id="step3">
                <h2 class="section-title">Выберите время</h2>
                <div class="time-slots" id="timeSlots">
                    <!-- Время будет добавлено через JS -->
                </div>
                <div class="form-group">
                    <button class="btn btn-secondary" onclick="prevStep()">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                    <button class="btn" onclick="nextStep()" id="nextBtn3" disabled>
                        Далее <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
            
            <!-- Шаг 4: Данные клиента -->
            <div class="step-content" id="step4">
                <h2 class="section-title">Ваши данные</h2>
                
                <!-- Сводка -->
                <div class="summary-card">
                    <div class="summary-item">
                        <span>Услуга:</span>
                        <span id="summaryService">—</span>
                    </div>
                    <div class="summary-item">
                        <span>Дата:</span>
                        <span id="summaryDate">—</span>
                    </div>
                    <div class="summary-item">
                        <span>Время:</span>
                        <span id="summaryTime">—</span>
                    </div>
                    <div class="summary-total">
                        <span>Итого:</span>
                        <span id="summaryPrice">0 руб.</span>
                    </div>
                </div>
                
                <!-- Форма -->
                <div class="form-group">
                    <label class="form-label">Ваше имя *</label>
                    <input type="text" class="form-input" id="clientName" placeholder="Иван Иванов" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Номер телефона *</label>
                    <input type="tel" class="form-input" id="clientPhone" placeholder="+7 999 123-45-67" required>
                </div>
                
                <div class="form-group">
                    <button class="btn btn-secondary" onclick="prevStep()">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                    <button class="btn" onclick="submitBooking()" id="submitBtn">
                        <i class="fas fa-check"></i> Записаться
                    </button>
                </div>
            </div>
            
            <!-- Шаг 5: Подтверждение -->
            <div class="step-content" id="step5">
                <div class="success-message">
                    <div class="success-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2 style="margin-bottom: 15px; color: #28a745;">Запись подтверждена! 🎉</h2>
                    <p style="margin-bottom: 10px; color: #666;">Барбер <strong id="confirmBarberName"></strong> ожидает вас</p>
                    <p style="margin-bottom: 20px; color: #666;"><strong id="confirmDateTime"></strong></p>
                    <p style="margin-bottom: 25px; color: #666; font-size: 14px;">На ваш телефон придет SMS с подтверждением</p>
                    <button class="btn" onclick="goToProfile()" style="margin-bottom: 10px;">
                        <i class="fas fa-user"></i> Перейти в профиль
                    </button>
                    <button class="btn btn-secondary" onclick="goHome()">
                        <i class="fas fa-home"></i> На главную
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация
        const API_BASE = 'https://barber-booking-db.onrender.com';
        
        // Данные записи
        let bookingData = {
            barber: null,
            service: null,
            date: null,
            time: null,
            clientName: '',
            clientPhone: ''
        };
        
        // Текущий шаг
        let currentStep = 1;
        
        // Загрузка при открытии
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Клиентская панель загружается...');
            loadUserAvatar();
            loadBarberData();
            generateDates();
            initSteps();
        });
        
        // ========== ФУНКЦИИ ПРОФИЛЯ ==========
        function openProfile() {
            window.location.href = API_BASE + '/client-profile';
        }
        
        function loadUserAvatar() {
            const savedUser = localStorage.getItem('telegram_user');
            if (savedUser) {
                const userData = JSON.parse(savedUser);
                updateAvatar(userData);
            }
        }
        
        function updateAvatar(userData) {
            const avatarImg = document.getElementById('userAvatarSmall');
            const avatarPlaceholder = document.getElementById('avatarPlaceholderSmall');
            
            if (userData.photoUrl) {
                avatarImg.src = userData.photoUrl;
                avatarImg.style.display = 'block';
                avatarPlaceholder.style.display = 'none';
            } else {
                // Генерация аватара по имени
                const name = `${userData.firstName || ''} ${userData.lastName || ''}`.trim();
                if (name) {
                    const firstLetter = name.charAt(0).toUpperCase();
                    avatarPlaceholder.innerHTML = firstLetter;
                } else {
                    avatarPlaceholder.innerHTML = '<i class="fas fa-user"></i>';
                }
                avatarPlaceholder.style.display = 'flex';
                avatarImg.style.display = 'none';
            }
        }
        
        // ========== ОСНОВНЫЕ ФУНКЦИИ ЗАПИСИ ==========
        
        // Инициализация шагов
        function initSteps() {
            const firstStep = document.querySelector('.step[data-step="1"]');
            const firstContent = document.getElementById('step1');
            
            if (firstStep && firstContent) {
                firstStep.classList.add('active');
                firstContent.classList.add('active');
            }
        }
        
        // Загрузка данных барбера
        async function loadBarberData() {
            const urlParams = new URLSearchParams(window.location.search);
            const barberCode = urlParams.get('code') || 'barber';
            
            console.log(`🔍 Загрузка данных барбера: ${barberCode}`);
            
            try {
                const response = await fetch(`${API_BASE}/api/barber/${barberCode}`);
                const result = await response.json();
                
                if (result.success && result.barber) {
                    bookingData.barber = result.barber;
                    displayBarberInfo(result.barber);
                    loadServices(barberCode);
                } else {
                    showError('Барбер не найден. Проверьте код.');
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки барбера:', error);
                // Демо-данные для тестирования
                bookingData.barber = {
                    name: "Александр Барбер",
                    code: barberCode,
                    id: 1
                };
                displayBarberInfo(bookingData.barber);
                loadServices(barberCode);
            }
        }
        
        // Показать информацию о барбере
        function displayBarberInfo(barber) {
            document.getElementById('barberName').textContent = barber.name;
            document.getElementById('barberCode').textContent = `Код: ${barber.code}`;
            
            const firstLetter = barber.name ? barber.name.charAt(0).toUpperCase() : 'Б';
            document.getElementById('barberAvatar').textContent = firstLetter;
            document.getElementById('confirmBarberName').textContent = barber.name;
        }
        
        // Загрузка услуг
        async function loadServices(barberCode) {
            console.log(`📋 Загрузка услуг для барбера: ${barberCode}`);
            
            try {
                const response = await fetch(`${API_BASE}/api/barber/${barberCode}/services`);
                const result = await response.json();
                
                if (result.success && result.services && result.services.length > 0) {
                    displayServices(result.services);
                } else if (Array.isArray(result) && result.length > 0) {
                    displayServices(result);
                } else {
                    showDemoServices();
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки услуг:', error);
                showDemoServices();
            }
        }
        
        // Показать демо-услуги
        function showDemoServices() {
            const demoServices = [
                { id: 1, name: "Мужская стрижка", price: 1500, duration: 45 },
                { id: 2, name: "Стрижка + Бритьё", price: 2000, duration: 60 },
                { id: 3, name: "Королевское бритьё", price: 800, duration: 30 },
                { id: 4, name: "Стрижка машинкой", price: 1000, duration: 30 },
                { id: 5, name: "Оформление бороды", price: 600, duration: 20 },
                { id: 6, name: "Детская стрижка", price: 1200, duration: 40 }
            ];
            
            displayServices(demoServices);
        }
        
        // Показать услуги
        function displayServices(services) {
            const container = document.getElementById('servicesList');
            
            if (!container) {
                console.error('Контейнер услуг не найден');
                return;
            }
            
            let html = '';
            
            services.forEach(service => {
                html += `
                    <div class="service-card" data-id="${service.id}" onclick="selectService(${service.id}, ${service.price}, '${service.name.replace(/'/g, "\\'")}')">
                        <div class="service-name">${service.name}</div>
                        <div class="service-price">${service.price} руб.</div>
                        <div class="service-duration">${service.duration} мин.</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Выбор услуги
        function selectService(id, price, name) {
            document.querySelectorAll('.service-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            const selectedCard = document.querySelector(`.service-card[data-id="${id}"]`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }
            
            bookingData.service = { id, price, name };
            document.getElementById('nextBtn1').disabled = false;
            updateSummary();
        }
        
        // Генерация дат (7 дней вперед)
        function generateDates() {
            const container = document.getElementById('datePicker');
            
            if (!container) {
                console.error('Контейнер дат не найден');
                return;
            }
            
            let html = '';
            
            for (let i = 0; i < 7; i++) {
                const date = new Date();
                date.setDate(date.getDate() + i);
                
                const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
                const monthNames = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
                
                const dayName = dayNames[date.getDay()];
                const dayNumber = date.getDate();
                const monthName = monthNames[date.getMonth()];
                const dateStr = date.toISOString().split('T')[0];
                
                html += `
                    <div class="date-option" data-date="${dateStr}" onclick="selectDate('${dateStr}', '${dayNumber} ${monthName} (${dayName})')">
                        <div class="date-day">${dayName}</div>
                        <div class="date-number">${dayNumber}</div>
                        <div class="date-month">${monthName}</div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        // Выбор даты
        function selectDate(date, displayDate) {
            document.querySelectorAll('.date-option').forEach(option => {
                option.classList.remove('selected');
            });
            
            const selectedOption = document.querySelector(`.date-option[data-date="${date}"]`);
            if (selectedOption) {
                selectedOption.classList.add('selected');
            }
            
            bookingData.date = date;
            bookingData.displayDate = displayDate;
            document.getElementById('nextBtn2').disabled = false;
            updateSummary();
            
            generateTimeSlots();
        }
        
        // Генерация временных слотов с учетом занятых
        async function generateTimeSlots() {
            const container = document.getElementById('timeSlots');
            
            if (!container) {
                console.error('Контейнер времени не найден');
                return;
            }
            
            if (!bookingData.date) {
                container.innerHTML = '<div class="loading">Выберите дату для отображения времени</div>';
                return;
            }
            
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка доступного времени...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/barber/${bookingData.barber.code}/booked-times?date=${bookingData.date}`);
                let bookedTimes = [];
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        bookedTimes = result.booked_times || [];
                        console.log(`📅 Занятые времена на ${bookingData.date}:`, bookedTimes);
                    }
                }
                
                let html = '';
                const startHour = 9;
                const endHour = 21;
                const today = new Date().toISOString().split('T')[0];
                const isToday = bookingData.date === today;
                const now = new Date();
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                
                for (let hour = startHour; hour < endHour; hour++) {
                    for (let minute = 0; minute < 60; minute += 30) {
                        const time = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
                        const isBooked = bookedTimes.includes(time);
                        
                        let isPast = false;
                        if (isToday) {
                            if (hour < currentHour || (hour === currentHour && minute < currentMinute)) {
                                isPast = true;
                            }
                        }
                        
                        if (isPast) continue;
                        
                        html += `
                            <div class="time-slot ${isBooked ? 'disabled' : ''} ${bookingData.time === time ? 'selected' : ''}" 
                                 data-time="${time}" 
                                 ${!isBooked ? `onclick="selectTime('${time}')"` : ''}>
                                ${time}
                                ${isBooked ? '<br><small style="color:#dc3545;font-size:12px;">Занято</small>' : ''}
                            </div>
                        `;
                    }
                }
                
                if (html === '') {
                    html = '<div class="error-message" style="grid-column: 1 / -1; text-align:center; margin:20px 0; padding:15px; background:#ffebee; color:#c62828; border-radius:8px;">На эту дату все время занято. Выберите другую дату.</div>';
                }
                
                container.innerHTML = html;
                
                if (bookingData.time && bookedTimes.includes(bookingData.time)) {
                    bookingData.time = null;
                    updateSummary();
                }
                
            } catch (error) {
                console.error('Ошибка загрузки времени:', error);
                showFallbackTimeSlots();
            }
        }
        
        // Запасной вариант если API не работает
        function showFallbackTimeSlots() {
            const container = document.getElementById('timeSlots');
            let html = '';
            
            const timeSlots = [
                '10:00', '11:00', '12:00', '13:00', '14:00', 
                '15:00', '16:00', '17:00', '18:00', '19:00'
            ];
            
            timeSlots.forEach(time => {
                html += `
                    <div class="time-slot" data-time="${time}" onclick="selectTime('${time}')">
                        ${time}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Выбор времени
        function selectTime(time) {
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.classList.remove('selected');
            });
            
            const selectedSlot = document.querySelector(`.time-slot[data-time="${time}"]`);
            if (selectedSlot && !selectedSlot.classList.contains('disabled')) {
                selectedSlot.classList.add('selected');
                bookingData.time = time;
                document.getElementById('nextBtn3').disabled = false;
                updateSummary();
            }
        }
        
        // Обновление сводки
        function updateSummary() {
            if (bookingData.service) {
                document.getElementById('summaryService').textContent = `${bookingData.service.name}`;
                document.getElementById('summaryPrice').textContent = `${bookingData.service.price} руб.`;
            }
            
            if (bookingData.displayDate) {
                document.getElementById('summaryDate').textContent = bookingData.displayDate;
            }
            
            if (bookingData.time) {
                document.getElementById('summaryTime').textContent = bookingData.time;
            }
        }
        
        // Навигация по шагам
        function nextStep() {
            if (!validateCurrentStep()) {
                return;
            }
            
            const currentStepElement = document.querySelector(`.step[data-step="${currentStep}"]`);
            const currentContent = document.getElementById(`step${currentStep}`);
            
            if (!currentStepElement || !currentContent) {
                console.error(`Шаг ${currentStep} не найден`);
                return;
            }
            
            currentStepElement.classList.remove('active');
            currentContent.classList.remove('active');
            currentStep++;
            
            const nextStepElement = document.querySelector(`.step[data-step="${currentStep}"]`);
            const nextContent = document.getElementById(`step${currentStep}`);
            
            if (nextStepElement && nextContent) {
                nextStepElement.classList.add('active');
                nextContent.classList.add('active');
            }
            
            if (currentStep === 5) {
                showConfirmation();
            }
        }
        
        function prevStep() {
            if (currentStep <= 1) return;
            
            const currentStepElement = document.querySelector(`.step[data-step="${currentStep}"]`);
            const currentContent = document.getElementById(`step${currentStep}`);
            
            if (!currentStepElement || !currentContent) {
                console.error(`Шаг ${currentStep} не найден`);
                return;
            }
            
            currentStepElement.classList.remove('active');
            currentContent.classList.remove('active');
            currentStep--;
            
            const prevStepElement = document.querySelector(`.step[data-step="${currentStep}"]`);
            const prevContent = document.getElementById(`step${currentStep}`);
            
            if (prevStepElement && prevContent) {
                prevStepElement.classList.add('active');
                prevContent.classList.add('active');
            }
        }
        
        // Валидация текущего шага
        function validateCurrentStep() {
            switch(currentStep) {
                case 1:
                    if (!bookingData.service) {
                        showError('Выберите услугу');
                        return false;
                    }
                    break;
                    
                case 2:
                    if (!bookingData.date) {
                        showError('Выберите дату');
                        return false;
                    }
                    break;
                    
                case 3:
                    if (!bookingData.time) {
                        showError('Выберите время');
                        return false;
                    }
                    break;
                    
                case 4:
                    if (!validateStep4()) {
                        return false;
                    }
                    break;
            }
            
            hideError();
            return true;
        }
        
        // Валидация шага 4
        function validateStep4() {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            
            if (!name || name.length < 2) {
                showError('Введите ваше имя (минимум 2 символа)');
                return false;
            }
            
            if (!phone || phone.replace(/\D/g, '').length < 10) {
                showError('Введите корректный номер телефона (минимум 10 цифр)');
                return false;
            }
            
            bookingData.clientName = name;
            bookingData.clientPhone = phone;
            return true;
        }
        
        // Показать подтверждение
        function showConfirmation() {
            if (bookingData.displayDate && bookingData.time) {
                document.getElementById('confirmDateTime').textContent = `${bookingData.displayDate} в ${bookingData.time}`;
            }
        }
        
        // Отправка записи на сервер
        async function submitBooking() {
            if (!validateStep4()) {
                return;
            }
            
            if (!bookingData.barber || !bookingData.service || !bookingData.date || !bookingData.time || !bookingData.clientName || !bookingData.clientPhone) {
                showError('Заполните все данные');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            
            try {
                submitBtn.innerHTML = '<span class="loading-spinner"></span> Создание записи...';
                submitBtn.disabled = true;
                
                console.log('📤 Отправка записи на сервер:', bookingData);
                
                // Получаем данные пользователя для отправки telegram_id
                const savedUser = localStorage.getItem('telegram_user');
                let telegram_id = null;
                let first_name = '';
                let last_name = '';
                
                if (savedUser) {
                    const userData = JSON.parse(savedUser);
                    telegram_id = userData.id;
                    first_name = userData.firstName || '';
                    last_name = userData.lastName || '';
                }
                
                const response = await fetch(`${API_BASE}/api/appointments/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        barber_code: bookingData.barber.code,
                        client_name: bookingData.clientName,
                        client_phone: bookingData.clientPhone,
                        service_name: bookingData.service.name,
                        price: bookingData.service.price,
                        date: bookingData.date,
                        time: bookingData.time,
                        telegram_id: telegram_id,
                        first_name: first_name,
                        last_name: last_name
                    })
                });
                
                const result = await response.json();
                console.log('📥 Ответ сервера:', result);
                
                if (result.success) {
                    // Сохраняем барбера для будущих записей
                    localStorage.setItem('last_barber_code', bookingData.barber.code);
                    
                    // Сохраняем запись в историю
                    const appointment = {
                        id: result.appointment_id,
                        service: bookingData.service.name,
                        price: bookingData.service.price,
                        date: bookingData.date,
                        time: bookingData.time,
                        barber: bookingData.barber.name,
                        barber_code: bookingData.barber.code,
                        status: 'active'
                    };
                    
                    // Сохраняем в localStorage для быстрого доступа
                    const savedHistory = localStorage.getItem('user_appointments');
                    let history = [];
                    if (savedHistory) {
                        history = JSON.parse(savedHistory);
                    }
                    history.unshift(appointment);
                    localStorage.setItem('user_appointments', JSON.stringify(history));
                    
                    // Обновляем данные пользователя
                    if (savedUser) {
                        const userData = JSON.parse(savedUser);
                        userData.last_barber_code = bookingData.barber.code;
                        localStorage.setItem('telegram_user', JSON.stringify(userData));
                    }
                    
                    // Успех - переходим к подтверждению
                    hideError();
                    nextStep();
                } else {
                    showError(result.error || 'Ошибка создания записи');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
                
            } catch (error) {
                console.error('❌ Ошибка при создании записи:', error);
                showError('Ошибка соединения с сервером. Попробуйте еще раз.');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }
        
        // Вспомогательные функции
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            } else {
                alert(message);
            }
        }
        
        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            if (errorDiv) {
                errorDiv.style.display = 'none';
            }
        }
        
        function goBack() {
            window.location.href = '/client-login';
        }
        
        function goHome() {
            window.location.href = '/';
        }
        
        function goToProfile() {
            window.location.href = API_BASE + '/client-profile';
        }

// Показываем экран успеха с таймером редиректа
function showSuccessWithTimer(result) {

    const currentStepElement = document.querySelector(`.step[data-step="${currentStep}"]`);
    const currentContent = document.getElementById(`step${currentStep}`);
    
    if (currentStepElement && currentContent) {
        currentStepElement.classList.remove('active');
        currentContent.classList.remove('active');
    }
    
    // Показываем шаг успеха
    currentStep = 5;
    const successStepElement = document.querySelector('.step[data-step="5"]');

        successStepElement.classList.add('active');

// Таймер редиректа
let redirectTimer = 5;
let timerInterval;

function startRedirectTimer() {
    const timerElement = document.getElementById('redirectTimer');
    if (!timerElement) return;
    
    timerInterval = setInterval(() => {
        redirectTimer--;
        timerElement.textContent = `Через ${redirectTimer} секунд вы будете перенаправлены в профиль...`;
        
        if (redirectTimer <= 0) {
            clearInterval(timerInterval);
            goToProfile();
        }
    }, 1000);
}

// Функция для создания еще одной записи
function createAnotherAppointment() {
    clearInterval(timerInterval);
    window.location.reload();
}

// Переход в профиль
function goToProfile() {
    clearInterval(timerInterval);
    window.location.href = API_BASE + '/client-profile';
}
