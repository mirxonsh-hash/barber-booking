<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись к барберу | iWant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1a1a1a;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-left: 1px solid #333;
            border-right: 1px solid #333;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            color: white;
            padding: 25px 20px;
            position: relative;
            border-bottom: 1px solid #333;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            position: absolute;
            top: 25px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .profile-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #4a6fa5;
            position: absolute;
            top: 25px;
            right: 20px;
            background: #222;
        }
        
        .profile-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        
        .profile-btn .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4a6fa5 0%, #0a0a0a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        
        .barber-info {
            text-align: center;
            margin-top: 10px;
        }
        
        .barber-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #222;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #4a6fa5;
            border: 3px solid #333;
        }
        
        .barber-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }
        
        .barber-code {
            opacity: 0.7;
            font-size: 14px;
            color: #aaa;
        }
        
        .booking-steps {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }
        
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .step-circle {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(74, 111, 165, 0.2);
            border: 2px solid rgba(74, 111, 165, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #aaa;
        }
        
        .step.active .step-circle {
            background: #4a6fa5;
            color: white;
            border-color: #4a6fa5;
        }
        
        .step-label {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        
        .step.active .step-label {
            color: #4a6fa5;
            font-weight: bold;
        }
        
        .content {
            padding: 25px;
        }
        
        .step-content {
            display: none;
        }
        
        .step-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .services-grid {
            display: grid;
            gap: 15px;
        }
        
        .service-card {
            border: 2px solid #333;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s;
            background: #222;
        }
        
        .service-card:hover {
            border-color: #4a6fa5;
            background: rgba(74, 111, 165, 0.1);
        }
        
        .service-card.selected {
            border-color: #4a6fa5;
            background: rgba(74, 111, 165, 0.15);
        }
        
        .service-name {
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .service-price {
            color: #4a6fa5;
            font-weight: bold;
            font-size: 18px;
        }
        
        .service-duration {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .date-picker {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .date-option {
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #222;
        }
        
        .date-option:hover {
            border-color: #4a6fa5;
        }
        
        .date-option.selected {
            border-color: #4a6fa5;
            background: rgba(74, 111, 165, 0.15);
        }
        
        .date-day {
            font-weight: bold;
            color: #fff;
        }
        
        .date-number {
            font-size: 24px;
            font-weight: bold;
            color: #4a6fa5;
            margin: 5px 0;
        }
        
        .date-month {
            color: #aaa;
            font-size: 14px;
        }
        
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .time-slot {
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #222;
            color: #fff;
        }
        
        .time-slot:hover {
            border-color: #4a6fa5;
        }
        
        .time-slot.selected {
            border-color: #4a6fa5;
            background: rgba(74, 111, 165, 0.15);
        }
        
        .time-slot.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #1a1a1a;
            border-color: #222;
            color: #666;
        }
        
        .time-slot.disabled:hover {
            border-color: #222;
            background: #1a1a1a;
            color: #666;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #fff;
        }
        
        .form-input {
            width: 100%;
            padding: 14px;
            background: #222;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            color: #fff;
        }
        
        .form-input:focus {
            border-color: #4a6fa5;
            outline: none;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: #4a6fa5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: #5a7fb5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 111, 165, 0.4);
        }
        
        .btn-secondary {
            background: #333;
        }
        
        .btn-secondary:hover {
            background: #444;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .summary-card {
            background: #222;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #333;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
            color: #fff;
        }
        
        .summary-total {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .success-message {
            text-align: center;
            padding: 40px 20px;
        }
        
        .success-icon {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 20px;
        }
        
        .error-message {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .appointment-success {
            text-align: center;
            padding: 40px 20px;
            background: #1a1a1a;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 20px auto;
            max-width: 600px;
            animation: fadeIn 0.5s;
            border: 1px solid #333;
        }
        
        .appointment-success-icon {
            font-size: 80px;
            color: #28a745;
            margin-bottom: 20px;
        }
        
        .appointment-details {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            margin: 20px 0;
            border: 1px solid #333;
        }
        
        .appointment-details p {
            margin: 10px 0;
            padding: 5px 0;
            border-bottom: 1px solid #333;
            color: #fff;
        }
        
        .appointment-details p:last-child {
            border-bottom: none;
        }
        
        .appointment-actions {
            margin-top: 30px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4a6fa5 0%, #1a1a1a 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            border: 1px solid #333;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 111, 165, 0.4);
        }
    </style>
</head>
<body>
    <!-- ОСТАЛЬНОЙ HTML КОД БЕЗ ИЗМЕНЕНИЙ -->
    <div class="container" id="clientPanel">
        <div class="header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <div class="profile-btn" onclick="openProfile()">
                <img id="userAvatarSmall" src="" alt="Профиль">
                <div id="avatarPlaceholderSmall" class="avatar-placeholder">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            
            <div class="barber-info">
                <div class="barber-avatar" id="barberAvatar">Б</div>
                <div class="barber-name" id="barberName">Загрузка...</div>
                <div class="barber-code" id="barberCode">Код: </div>
            </div>
            
            <div class="booking-steps">
                <div class="step active" data-step="1">
                    <div class="step-circle">1</div>
                    <div class="step-label">Услуга</div>
                </div>
                <div class="step" data-step="2">
                    <div class="step-circle">2</div>
                    <div class="step-label">Дата</div>
                </div>
                <div class="step" data-step="3">
                    <div class="step-circle">3</div>
                    <div class="step-label">Время</div>
                </div>
                <div class="step" data-step="4">
                    <div class="step-circle">4</div>
                    <div class="step-label">Данные</div>
                </div>
            </div>
        </div>
        
        <div class="content">
            <div class="error-message" id="errorMessage"></div>
            
            <div class="step-content active" id="step1">
                <h2 class="section-title">Выберите услугу</h2>
                <div class="services-grid" id="servicesList">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i> Загрузка услуг...
                    </div>
                </div>
                <button class="btn" onclick="nextStep()" id="nextBtn1" disabled>
                    Далее <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            
            <div class="step-content" id="step2">
                <h2 class="section-title">Выберите дату</h2>
                <div class="date-picker" id="datePicker">
                </div>
                <div class="form-group">
                    <button class="btn btn-secondary" onclick="prevStep()">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                    <button class="btn" onclick="nextStep()" id="nextBtn2" disabled>
                        Далее <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
            
            <div class="step-content" id="step3">
                <h2 class="section-title">Выберите время</h2>
                <div class="time-slots" id="timeSlots">
                </div>
                <div class="form-group">
                    <button class="btn btn-secondary" onclick="prevStep()">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                    <button class="btn" onclick="nextStep()" id="nextBtn3" disabled>
                        Далее <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
            
            <div class="step-content" id="step4">
                <h2 class="section-title">Ваши данные</h2>
                
                <div class="summary-card">
                    <div class="summary-item">
                        <span>Услуга:</span>
                        <span id="summaryService">—</span>
                    </div>
                    <div class="summary-item">
                        <span>Дата:</span>
                        <span id="summaryDate">—</span>
                    </div>
                    <div class="summary-item">
                        <span>Время:</span>
                        <span id="summaryTime">—</span>
                    </div>
                    <div class="summary-total">
                        <span>Итого:</span>
                        <span id="summaryPrice">0 руб.</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Ваше имя *</label>
                    <input type="text" class="form-input" id="clientName" placeholder="Иван Иванов" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Номер телефона *</label>
                    <input type="tel" class="form-input" id="clientPhone" placeholder="+7 999 123-45-67" required>
                </div>
                
                <div class="form-group">
                    <button class="btn btn-secondary" onclick="prevStep()">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                    <button class="btn" onclick="submitBooking()" id="submitBtn">
                        <i class="fas fa-check"></i> Записаться
                    </button>
                </div>
            </div>
            
            <div class="step-content" id="step5">
                <div class="success-message">
                    <div class="success-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2 style="margin-bottom: 15px; color: #28a745;">Запись подтверждена! 🎉</h2>
                    <p style="margin-bottom: 10px; color: #aaa;">Барбер <strong id="confirmBarberName"></strong> ожидает вас</p>
                    <p style="margin-bottom: 20px; color: #aaa;"><strong id="confirmDateTime"></strong></p>
                    <p style="margin-bottom: 25px; color: #aaa; font-size: 14px;">На ваш телефон придет SMS с подтверждением</p>
                    <button class="btn" onclick="goToProfile()" style="margin-bottom: 10px;">
                        <i class="fas fa-user"></i> Перейти в профиль
                    </button>
                    <button class="btn btn-secondary" onclick="goHome()">
                        <i class="fas fa-home"></i> На главную
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript код без изменений -->
    <script>
        // Весь JavaScript код остается без изменений
        const API_BASE = 'https://barber-booking-db.onrender.com';
        
        let bookingData = {
            barber: null,
            service: null,
            date: null,
            time: null,
            clientName: '',
            clientPhone: ''
        };
        
        let currentStep = 1;
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Клиентская панель загружается...');
            loadUserAvatar();
            loadBarberData();
            generateDates();
            initSteps();
        });
        
        // ... Весь остальной JavaScript код без изменений ...
    </script>
</body>
</html>
