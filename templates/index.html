<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iWant - Премиум запись к барберу</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 20px;
        }
        
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        
        .hero p {
            font-size: 20px;
            max-width: 600px;
            margin: 0 auto 40px;
            opacity: 0.9;
        }
        
        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
            padding: 18px 35px;
            font-size: 18px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 18px 35px;
            font-size: 18px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .footer {
            background: #1a1a2e;
            color: white;
            padding: 30px 0;
            text-align: center;
        }
        
        /* Стили для ссылок в header */
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="/" class="logo">
                    <i class="fas fa-cut"></i> iWant
                </a>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link active">Главная</a></li>
                    <li><a href="/client-login" class="nav-link">Записаться</a></li>
                    <li><a href="/barber-login" class="nav-link">Для барберов</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Запись к барберу<br>за 30 секунд</h1>
                <p>Выбирайте лучших мастеров, бронируйте удобное время, приходите без очередей</p>
                <div class="hero-buttons">
                    <a href="/client-login" class="btn btn-primary">
                        <i class="fas fa-user"></i> Я клиент
                    </a>
                    <a href="/barber-login" class="btn btn-secondary">
                        <i class="fas fa-user-tie"></i> Я барбер
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="copyright">
                    © 2024 iWant. Все права защищены.
                </div>
            </div>
        </div>
    </footer>

    <script src="js/home.js"></script>
</body>
</html>
