<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iWant - Премиум запись к барберу</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
        }
        
        .header {
            background: #1a1a1a;
            padding: max(2vh, 15px) 0;
            border-bottom: 1px solid #333;
            width: 100%;
        }
        
        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 max(2vw, 15px);
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .logo {
            font-size: clamp(20px, 4vw, 28px);
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.5vw, 12px);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: clamp(10px, 2vw, 30px);
        }
        
        .nav-link {
            color: #aaa;
            text-decoration: none;
            padding: clamp(8px, 1.5vw, 12px) clamp(12px, 2vw, 20px);
            border-radius: 6px;
            transition: all 0.3s;
            font-size: clamp(14px, 2vw, 16px);
            white-space: nowrap;
        }
        
        .nav-link:hover, .nav-link.active {
            background: #333;
            color: #fff;
        }
        
        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding: max(4vh, 40px) max(3vw, 20px);
            border-bottom: 1px solid #333;
        }
        
        .hero h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin-bottom: max(2vh, 20px);
            line-height: 1.2;
            color: #fff;
            word-wrap: break-word;
        }
        
        .hero p {
            font-size: clamp(16px, 3vw, 22px);
            max-width: min(800px, 90vw);
            margin: 0 auto max(4vh, 40px);
            color: #aaa;
            line-height: 1.5;
        }
        
        .hero-buttons {
            display: flex;
            gap: clamp(15px, 3vw, 30px);
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: clamp(14px, 2.5vw, 20px) clamp(25px, 4vw, 40px);
            font-size: clamp(16px, 2.5vw, 20px);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: clamp(8px, 1.5vw, 12px);
            text-decoration: none;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-weight: 600;
            min-width: max-content;
        }
        
        .btn-primary {
            background: #4a6fa5;
            color: white;
        }
        
        .btn-secondary {
            background: #333;
            color: white;
            border: 1px solid #444;
        }
        
        .btn-primary:hover {
            background: #5a7fb5;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(74, 111, 165, 0.3);
        }
        
        .btn-secondary:hover {
            background: #444;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .footer {
            background: #1a1a1a;
            color: #aaa;
            padding: clamp(20px, 3vh, 30px) 0;
            text-align: center;
            border-top: 1px solid #333;
            width: 100%;
        }
        
        .copyright {
            font-size: clamp(12px, 2vw, 14px);
        }
        
        /* Адаптивные стили для мобильных устройств */
        @media (max-width: 480px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .hero-buttons {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
            
            .hero h1 {
                font-size: 28px;
            }
            
            .hero p {
                font-size: 16px;
            }
        }
        
        /* Адаптивные стили для планшетов */
        @media (min-width: 481px) and (max-width: 768px) {
            .hero h1 {
                font-size: 36px;
            }
            
            .hero p {
                font-size: 18px;
            }
        }
        
        /* Адаптивные стили для больших экранов */
        @media (min-width: 1400px) {
            .container {
                padding: 0 40px;
            }
            
            .hero h1 {
                font-size: 64px;
            }
        }
        
        /* Поддержка ориентации устройства */
        @media (orientation: landscape) and (max-height: 600px) {
            .hero {
                min-height: calc(100vh - 70px);
                padding: 20px;
            }
            
            .hero h1 {
                font-size: 32px;
                margin-bottom: 15px;
            }
            
            .hero p {
                font-size: 16px;
                margin-bottom: 20px;
            }
        }
        
        /* Поддержка высоких экранов */
        @media (min-height: 1000px) {
            .hero {
                min-height: 85vh;
            }
            
            .hero h1 {
                font-size: 64px;
                margin-bottom: 40px;
            }
            
            .hero p {
                font-size: 28px;
                margin-bottom: 60px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="/" class="logo">
                    <i class="fas fa-cut"></i> iWant
                </a>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link active">Главная</a></li>
                    <li><a href="/client-login" class="nav-link">Записаться</a></li>
                    <li><a href="/barber-login" class="nav-link">Для барберов</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Запись к барберу<br>за 30 секунд</h1>
                <p>Выбирайте лучших мастеров, бронируйте удобное время, приходите без очередей</p>
                <div class="hero-buttons">
                    <a href="/client-login" class="btn btn-primary">
                        <i class="fas fa-user"></i> Я клиент
                    </a>
                    <a href="/barber-login" class="btn btn-secondary">
                        <i class="fas fa-user-tie"></i> Я барбер
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="copyright">
                    © 2024 iWant. Все права защищены.
                </div>
            </div>
        </div>
    </footer>

    <script src="js/home.js"></script>
</body>
</html>
