<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Выбор времени</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0a0a0a; 
            color: #fff;
        }
        
        .container { 
            max-width: 400px; 
            margin: auto; 
            background: #1a1a1a; 
            min-height: 100vh;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
        }
        
        .header { 
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%); 
            color: white; 
            padding: 20px; 
            text-align: center; 
            border-bottom: 1px solid #333;
        }
        
        .back-btn { 
            background: none; 
            border: none; 
            color: white; 
            font-size: 20px; 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            cursor: pointer; 
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .chart { 
            width: 200px; 
            height: 200px; 
            margin: 30px auto; 
            border-radius: 50%; 
            background: conic-gradient(#4a6fa5 10%, #333 0); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 5px solid #222;
        }
        
        .chart-inner { 
            width: 140px; 
            height: 140px; 
            background: #1a1a1a; 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid #333;
        }
        
        .percent { 
            font-size: 32px; 
            font-weight: bold; 
            color: #4a6fa5;
        }
        
        .stats { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            margin: 20px 0; 
        }
        
        .stat { 
            text-align: center; 
        }
        
        .time-buttons { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            padding: 20px; 
        }
        
        .time-btn { 
            flex: 1; 
            min-width: 80px; 
            padding: 12px; 
            background: #222; 
            border: 2px solid #333; 
            border-radius: 8px; 
            color: #fff; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        
        .time-btn:hover { 
            background: #4a6fa5; 
            color: white; 
            border-color: #4a6fa5;
        }
        
        .book-btn { 
            background: #4a6fa5; 
            color: white; 
            border: none; 
            padding: 15px; 
            margin: 20px; 
            border-radius: 10px; 
            font-size: 18px; 
            cursor: pointer; 
            width: calc(100% - 40px); 
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .book-btn:hover {
            background: #5a7fb5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 111, 165, 0.4);
        }
        
        h2 {
            color: #fff;
        }
        
        p {
            color: #aaa;
        }
        
        h3 {
            color: #fff;
            padding: 0 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <h2>Выберите время</h2>
            <p>Запись к Александру</p>
        </div>
        
        <div class="chart">
            <div class="chart-inner">
                <div class="percent">10%</div>
                <div style="font-size: 14px; color: #aaa;">заполнено</div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div style="font-size: 24px; font-weight: bold; color: #4a6fa5;">1.5%</div>
                <div style="font-size: 14px; color: #aaa;">Отмен</div>
            </div>
            <div class="stat">
                <div style="font-size: 24px; font-weight: bold; color: #28a745;">98.5%</div>
                <div style="font-size: 14px; color: #aaa;">Выполнено</div>
            </div>
        </div>
        
        <div style="padding: 0 20px;">
            <h3>Доступное время:</h3>
        </div>
        
        <div class="time-buttons">
            <button class="time-btn">14:00</button>
            <button class="time-btn">15:30</button>
            <button class="time-btn">17:00</button>
            <button class="time-btn">18:30</button>
        </div>
        
        <button class="book-btn" onclick="bookAppointment()">Записаться</button>
    </div>
    
    <!-- JavaScript код без изменений -->
    <script>
        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            window.location.href = '/profile?code=' + code;
        }
        
        function bookAppointment() {
            alert('✅ Запись подтверждена! Барбер свяжется с вами.');
        }
    </script>
</body>
</html>
