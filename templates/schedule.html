<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Выбор времени</title>
    <style>
        body { font-family: Arial; margin: 0; background: #f5f5f5; }
        .container { max-width: 400px; margin: auto; background: white; min-height: 100vh; }
        .header { background: #222; color: white; padding: 20px; text-align: center; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; position: absolute; top: 20px; left: 20px; cursor: pointer; }
        .chart { width: 200px; height: 200px; margin: 30px auto; border-radius: 50%; background: conic-gradient(#667eea 10%, #eee 0); display: flex; align-items: center; justify-content: center; }
        .chart-inner { width: 140px; height: 140px; background: white; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .percent { font-size: 32px; font-weight: bold; }
        .stats { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
        .stat { text-align: center; }
        .time-buttons { display: flex; flex-wrap: wrap; gap: 10px; padding: 20px; }
        .time-btn { flex: 1; min-width: 80px; padding: 12px; background: white; border: 2px solid #667eea; border-radius: 8px; color: #667eea; font-weight: bold; cursor: pointer; }
        .time-btn:hover { background: #667eea; color: white; }
        .book-btn { background: #667eea; color: white; border: none; padding: 15px; margin: 20px; border-radius: 10px; font-size: 18px; cursor: pointer; width: calc(100% - 40px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <h2>Выберите время</h2>
            <p>Запись к Александру</p>
        </div>
        
        <div class="chart">
            <div class="chart-inner">
                <div class="percent">10%</div>
                <div style="font-size: 14px; color: #666;">заполнено</div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div style="font-size: 24px; font-weight: bold; color: #667eea;">1.5%</div>
                <div style="font-size: 14px; color: #666;">Отмен</div>
            </div>
            <div class="stat">
                <div style="font-size: 24px; font-weight: bold; color: #28a745;">98.5%</div>
                <div style="font-size: 14px; color: #666;">Выполнено</div>
            </div>
        </div>
        
        <div style="padding: 0 20px;">
            <h3>Доступное время:</h3>
        </div>
        
        <div class="time-buttons">
            <button class="time-btn">14:00</button>
            <button class="time-btn">15:30</button>
            <button class="time-btn">17:00</button>
            <button class="time-btn">18:30</button>
        </div>
        
        <button class="book-btn" onclick="bookAppointment()">Записаться</button>
    </div>
    
    <script>
        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            window.location.href = '/profile?code=' + code;
        }
        
        function bookAppointment() {
            alert('✅ Запись подтверждена! Барбер свяжется с вами.');
        }
    </script>
</body>
</html>
